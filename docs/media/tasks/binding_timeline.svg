<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t d" font-family='"Segoe UI","Helvetica Neue",system-ui,sans-serif'>
<title id="t">Binding on a timeline</title><desc id="d">Timeline chart of milliseconds after a display appears, where the reason for including it is to place Treisman's published timings for visual feature binding next to a separately sourced cross-modal lag. Parallel colour and shape maps run together. Attention then visits items serially at about 60 ms per item, or 120 to 180 ms per group. With a display of about 200 ms and attention occupied, 18 percent of trials gave illusory conjunctions against 6 percent intrusions; cued 150 ms ahead, the two were about equal at 10 and 12 percent. A dashed lane, not from Treisman, shows sound from 34 metres arriving about 100 ms after light.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7ee0a8"/></marker></defs>
<rect width="1280" height="800" fill="#0b1020"/>
<text x="24.0" y="48.0" font-size="36" fill="#ffffff" font-weight="700" text-anchor="start">Binding on a timeline</text>
<text x="24.0" y="80.0" font-size="23" fill="#a3aec6" font-weight="400" text-anchor="start">Treisman's numbers are for vision. Solid: published value. Dashed: schematic.</text>
<line x1="270.0" y1="96" x2="270.0" y2="668" stroke="#2a3350" stroke-width="1"/>
<text x="270.0" y="696.0" font-size="22" fill="#a3aec6" font-weight="400" text-anchor="middle">-200</text>
<line x1="392.5" y1="96" x2="392.5" y2="668" stroke="#2a3350" stroke-width="1"/>
<text x="392.5" y="696.0" font-size="22" fill="#a3aec6" font-weight="400" text-anchor="middle">-100</text>
<line x1="515.0" y1="96" x2="515.0" y2="668" stroke="#2a3350" stroke-width="1"/>
<text x="515.0" y="696.0" font-size="22" fill="#e7ecf5" font-weight="700" text-anchor="middle">0</text>
<line x1="637.5" y1="96" x2="637.5" y2="668" stroke="#2a3350" stroke-width="1"/>
<text x="637.5" y="696.0" font-size="22" fill="#a3aec6" font-weight="400" text-anchor="middle">100</text>
<line x1="760.0" y1="96" x2="760.0" y2="668" stroke="#2a3350" stroke-width="1"/>
<text x="760.0" y="696.0" font-size="22" fill="#a3aec6" font-weight="400" text-anchor="middle">200</text>
<line x1="882.5" y1="96" x2="882.5" y2="668" stroke="#2a3350" stroke-width="1"/>
<text x="882.5" y="696.0" font-size="22" fill="#a3aec6" font-weight="400" text-anchor="middle">300</text>
<line x1="1005.0" y1="96" x2="1005.0" y2="668" stroke="#2a3350" stroke-width="1"/>
<text x="1005.0" y="696.0" font-size="22" fill="#a3aec6" font-weight="400" text-anchor="middle">400</text>
<line x1="1127.5" y1="96" x2="1127.5" y2="668" stroke="#2a3350" stroke-width="1"/>
<text x="1127.5" y="696.0" font-size="22" fill="#a3aec6" font-weight="400" text-anchor="middle">500</text>
<line x1="1250.0" y1="96" x2="1250.0" y2="668" stroke="#2a3350" stroke-width="1"/>
<text x="1250.0" y="696.0" font-size="22" fill="#a3aec6" font-weight="400" text-anchor="middle">600</text>
<line x1="515.0" y1="96" x2="515.0" y2="668" stroke="#e7ecf5" stroke-width="2"/>
<line x1="270" y1="668" x2="1250" y2="668" stroke="#a3aec6" stroke-width="2"/>
<text x="760.0" y="724.0" font-size="22" fill="#a3aec6" font-weight="400" text-anchor="middle">milliseconds after the display appears</text>
<text x="24.0" y="128.0" font-size="23" fill="#ffffff" font-weight="700" text-anchor="start">Stage 1: parallel</text><text x="24.0" y="154.0" font-size="19" fill="#a3aec6" font-weight="400" text-anchor="start">no attention needed</text>
<rect x="515.0" y="106" width="735.0" height="36" rx="4" fill="none" stroke="#6fd3ff" stroke-width="2" stroke-dasharray="8 6"/><text x="525.0" y="132.0" font-size="21" fill="#e7ecf5" font-weight="600" text-anchor="start">colour map: something red is out there</text>
<rect x="515.0" y="148" width="735.0" height="36" rx="4" fill="none" stroke="#6fd3ff" stroke-width="2" stroke-dasharray="8 6"/><text x="525.0" y="174.0" font-size="21" fill="#e7ecf5" font-weight="600" text-anchor="start">shape map: a T is out there, but where?</text>
<text x="24.0" y="222.0" font-size="23" fill="#ffffff" font-weight="700" text-anchor="start">Stage 2: serial</text><text x="24.0" y="248.0" font-size="19" fill="#a3aec6" font-weight="400" text-anchor="start">one object at a time</text>
<rect x="515.0" y="200" width="71.0" height="40" rx="4" fill="#b48cff" stroke="#b48cff" stroke-width="2"/>
<text x="551.8" y="228.0" font-size="22" fill="#0b1020" font-weight="700" text-anchor="middle">1</text>
<rect x="588.5" y="200" width="71.0" height="40" rx="4" fill="#b48cff" stroke="#b48cff" stroke-width="2"/>
<text x="625.2" y="228.0" font-size="22" fill="#0b1020" font-weight="700" text-anchor="middle">2</text>
<rect x="662.0" y="200" width="71.0" height="40" rx="4" fill="#b48cff" stroke="#b48cff" stroke-width="2"/>
<text x="698.8" y="228.0" font-size="22" fill="#0b1020" font-weight="700" text-anchor="middle">3</text>
<rect x="735.5" y="200" width="71.0" height="40" rx="4" fill="#b48cff" stroke="#b48cff" stroke-width="2"/>
<text x="772.2" y="228.0" font-size="22" fill="#0b1020" font-weight="700" text-anchor="middle">4</text>
<rect x="809.0" y="200" width="71.0" height="40" rx="4" fill="#b48cff" stroke="#b48cff" stroke-width="2"/>
<text x="845.8" y="228.0" font-size="22" fill="#0b1020" font-weight="700" text-anchor="middle">5</text>
<rect x="882.5" y="200" width="71.0" height="40" rx="4" fill="#b48cff" stroke="#b48cff" stroke-width="2"/>
<text x="919.2" y="228.0" font-size="22" fill="#0b1020" font-weight="700" text-anchor="middle">6</text>
<rect x="956.0" y="200" width="71.0" height="40" rx="4" fill="#b48cff" stroke="#b48cff" stroke-width="2"/>
<text x="992.8" y="228.0" font-size="22" fill="#0b1020" font-weight="700" text-anchor="middle">7</text>
<rect x="1029.5" y="200" width="71.0" height="40" rx="4" fill="#b48cff" stroke="#b48cff" stroke-width="2"/>
<text x="1066.2" y="228.0" font-size="22" fill="#0b1020" font-weight="700" text-anchor="middle">8</text>
<text x="517.0" y="268.0" font-size="21" fill="#b48cff" font-weight="600" text-anchor="start">about 60 ms per item if each item is one visit</text>
<rect x="515.0" y="280" width="144.5" height="36" rx="4" fill="#b48cff" stroke="#b48cff" stroke-width="2"/><text x="525.0" y="306.0" font-size="21" fill="#0b1020" font-weight="600" text-anchor="start">120</text>
<rect x="662.0" y="280" width="220.5" height="36" rx="4" fill="#b48cff" stroke="#b48cff" stroke-width="2"/><text x="672.0" y="306.0" font-size="21" fill="#0b1020" font-weight="600" text-anchor="start">or 180</text>
<text x="894.5" y="306.0" font-size="21" fill="#b48cff" font-weight="600" text-anchor="start">ms if it visits pairs or small groups</text>
<text x="24.0" y="384.0" font-size="23" fill="#ffffff" font-weight="700" text-anchor="start">Too brief</text><text x="24.0" y="410.0" font-size="19" fill="#a3aec6" font-weight="400" text-anchor="start">attention busy with digits</text>
<rect x="515.0" y="362" width="245.0" height="40" rx="4" fill="#ffcf6f" stroke="#ffcf6f" stroke-width="2"/><text x="525.0" y="390.0" font-size="21" fill="#0b1020" font-weight="600" text-anchor="start">display, about 200 ms</text>
<text x="772.0" y="390.0" font-size="24" fill="#ffcf6f" font-weight="700" text-anchor="start">18% illusory conjunctions, 6% intrusions</text>
<text x="24.0" y="466.0" font-size="23" fill="#ffffff" font-weight="700" text-anchor="start">Cued first</text><text x="24.0" y="492.0" font-size="19" fill="#a3aec6" font-weight="400" text-anchor="start">focused on the target</text>
<line x1="331.2" y1="464" x2="511.0" y2="464" stroke="#7ee0a8" stroke-width="3" marker-end="url(#g)"/><circle cx="331.2" cy="464" r="7" fill="#7ee0a8"/>
<text x="331.2" y="438.0" font-size="21" fill="#7ee0a8" font-weight="600" text-anchor="start">cue, 150 ms before</text>
<rect x="515.0" y="444" width="183.8" height="40" rx="4" fill="none" stroke="#7ee0a8" stroke-width="2" stroke-dasharray="8 6"/><text x="525.0" y="472.0" font-size="21" fill="#e7ecf5" font-weight="600" text-anchor="start">briefer display</text>
<text x="710.8" y="472.0" font-size="24" fill="#7ee0a8" font-weight="700" text-anchor="start">binding errors gone: 10% and 12%</text>
<line x1="24" y1="514" x2="1250" y2="514" stroke="#a3aec6" stroke-width="2" stroke-dasharray="3 7"/>
<text x="24.0" y="544.0" font-size="23" fill="#ffffff" font-weight="700" text-anchor="start">Not Treisman: across the senses</text>
<line x1="515.0" y1="560" x2="515.0" y2="612" stroke="#e7ecf5" stroke-width="5"/>
<line x1="637.5" y1="560" x2="637.5" y2="612" stroke="#e7ecf5" stroke-width="5" stroke-dasharray="6 4"/>
<text x="505.0" y="594.0" font-size="22" fill="#e7ecf5" font-weight="600" text-anchor="end">light</text>
<text x="649.5" y="582.0" font-size="22" fill="#e7ecf5" font-weight="600" text-anchor="start">sound from 34 m arrives about 100 ms later</text>
<text x="649.5" y="610.0" font-size="21" fill="#a3aec6" font-weight="400" text-anchor="start">lags are ignored up to a point: a binding window</text>
<text x="24.0" y="594.0" font-size="19" fill="#a3aec6" font-weight="400" text-anchor="start">Wallace &amp; Stevenson 2014</text>
<text x="24.0" y="618.0" font-size="19" fill="#a3aec6" font-weight="400" text-anchor="start">Vroomen &amp; Keetels 2010</text>
<text x="24.0" y="642.0" font-size="19" fill="#a3aec6" font-weight="400" text-anchor="start">Different question, other authors</text>
<text x="24.0" y="752.0" font-size="19" fill="#a3aec6" font-weight="400" text-anchor="start">Vision: Treisman 1998, slopes also Treisman &amp; Gelade 1980. Serial reading is contested, and Treisman says "if it is serial at all".</text>
<text x="24.0" y="778.0" font-size="19" fill="#a3aec6" font-weight="400" text-anchor="start">Start of the visits and length of the feature maps are schematic.</text>
</svg>
