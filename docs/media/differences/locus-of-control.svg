<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t d" font-family='"Segoe UI","Helvetica Neue",system-ui,sans-serif'><title id="t">Locus of control: where the arrow points</title><desc id="d">Schematic of attribution arrows from one failed build to three causes, where the reason for including it is that the same event can be attributed to oneself, to powerful others or to chance.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1280" height="800" fill="#0b1020"/><text x="90.0" y="72.0" font-size="44" text-anchor="start" font-weight="700" fill="#ffffff">Locus of control: where the arrow points</text><rect x="90.0" y="300.0" width="260.0" height="140.0" rx="10" fill="none" stroke="#6fd3ff" stroke-width="3" /><text x="220.0" y="362.0" font-size="36" text-anchor="middle" font-weight="600" fill="#e7ecf5">The build</text><text x="220.0" y="407.0" font-size="36" text-anchor="middle" font-weight="600" fill="#e7ecf5">failed</text><line x1="355.0" y1="370.0" x2="555.0" y2="165.0" stroke="#6fd3ff" stroke-width="4" marker-end="url(#arrow)"/><text x="575.0" y="135.0" font-size="34" text-anchor="start" font-weight="700" fill="#e7ecf5">Me</text><text x="575.0" y="177.0" font-size="30" text-anchor="start" font-weight="400" fill="#e7ecf5">I skipped the tests</text><text x="575.0" y="217.0" font-size="28" text-anchor="start" font-weight="400" fill="#8a96b3">Then: change my habit</text><line x1="355.0" y1="370.0" x2="555.0" y2="370.0" stroke="#ffcf6f" stroke-width="4" stroke-dasharray="14 8" marker-end="url(#arrow)"/><text x="575.0" y="340.0" font-size="34" text-anchor="start" font-weight="700" fill="#e7ecf5">Powerful others</text><text x="575.0" y="382.0" font-size="30" text-anchor="start" font-weight="400" fill="#e7ecf5">The maintainer broke main</text><text x="575.0" y="422.0" font-size="28" text-anchor="start" font-weight="400" fill="#8a96b3">Then: raise it with them</text><line x1="355.0" y1="370.0" x2="555.0" y2="575.0" stroke="#b48cff" stroke-width="4" stroke-dasharray="4 8" marker-end="url(#arrow)"/><text x="575.0" y="545.0" font-size="34" text-anchor="start" font-weight="700" fill="#e7ecf5">Chance</text><text x="575.0" y="587.0" font-size="30" text-anchor="start" font-weight="400" fill="#e7ecf5">The CI runner is flaky</text><text x="575.0" y="627.0" font-size="28" text-anchor="start" font-weight="400" fill="#8a96b3">Then: run it again</text><text x="90.0" y="700.0" font-size="30" text-anchor="start" font-weight="600" fill="#e7ecf5">Same event, different arrow. Often each is partly true.</text><text x="90.0" y="738.0" font-size="26" text-anchor="start" font-weight="400" fill="#8a96b3">Varies by domain. Adult scores correlate about r = .50 over years.</text><text x="90.0" y="778.0" font-size="20" text-anchor="start" font-weight="400" fill="#8a96b3">Schematic. Rotter 1966; three-way split Levenson via Lachman 1986; stability Nowicki et al. 2018.</text></svg>
