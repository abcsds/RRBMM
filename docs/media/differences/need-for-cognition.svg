<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t d" font-family='"Segoe UI","Helvetica Neue",system-ui,sans-serif'><title id="t">Need for cognition: what effort costs you</title><desc id="d">Schematic line chart of the subjective value of a task against n-back difficulty, where the reason for including it is that people differ in how steeply effort discounts a task&#x27;s worth.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1280" height="800" fill="#0b1020"/><text x="90.0" y="72.0" font-size="44" text-anchor="start" font-weight="700" fill="#ffffff">Need for cognition: what effort costs you</text><line x1="150.0" y1="620.0" x2="820.0" y2="620.0" stroke="#8a96b3" stroke-width="2"/><line x1="150.0" y1="620.0" x2="150.0" y2="150.0" stroke="#8a96b3" stroke-width="2"/><text x="150.0" y="658.0" font-size="28" text-anchor="middle" font-weight="400" fill="#e7ecf5">1-back</text><text x="366.7" y="658.0" font-size="28" text-anchor="middle" font-weight="400" fill="#e7ecf5">2-back</text><text x="583.3" y="658.0" font-size="28" text-anchor="middle" font-weight="400" fill="#e7ecf5">3-back</text><text x="800.0" y="658.0" font-size="28" text-anchor="middle" font-weight="400" fill="#e7ecf5">4-back</text><text x="475.0" y="700.0" font-size="28" text-anchor="middle" font-weight="400" fill="#8a96b3">Task difficulty</text><text x="95" y="395.0" font-size="28" text-anchor="middle" fill="#8a96b3" transform="rotate(-90 95 395.0)">How much the task is worth to you</text><polyline points="150.0,206.0 166.7,211.7 183.3,217.3 200.0,222.8 216.7,228.3 233.3,233.7 250.0,239.0 266.7,244.2 283.3,249.4 300.0,254.5 316.7,259.5 333.3,264.5 350.0,269.4 366.7,274.2 383.3,279.0 400.0,283.6 416.7,288.3 433.3,292.8 450.0,297.3 466.7,301.8 483.3,306.1 500.0,310.5 516.7,314.7 533.3,318.9 550.0,323.1 566.7,327.1 583.3,331.2 600.0,335.1 616.7,339.1 633.3,342.9 650.0,346.7 666.7,350.5 683.3,354.2 700.0,357.8 716.7,361.4 733.3,365.0 750.0,368.5 766.7,372.0 783.3,375.4 800.0,378.7" fill="none" stroke="#6fd3ff" stroke-width="5" stroke-opacity="1.0" stroke-linejoin="round"/><polyline points="150.0,206.0 166.7,235.2 183.3,262.3 200.0,287.5 216.7,310.9 233.3,332.7 250.0,353.0 266.7,371.8 283.3,389.3 300.0,405.5 316.7,420.6 333.3,434.7 350.0,447.8 366.7,459.9 383.3,471.2 400.0,481.7 416.7,491.4 433.3,500.5 450.0,508.9 466.7,516.7 483.3,524.0 500.0,530.8 516.7,537.1 533.3,542.9 550.0,548.3 566.7,553.4 583.3,558.1 600.0,562.4 616.7,566.5 633.3,570.3 650.0,573.8 666.7,577.0 683.3,580.1 700.0,582.9 716.7,585.5 733.3,587.9 750.0,590.2 766.7,592.3 783.3,594.2 800.0,596.1" fill="none" stroke="#ffcf6f" stroke-width="5" stroke-opacity="1.0" stroke-linejoin="round" stroke-dasharray="14 9"/><text x="830.0" y="382.7" font-size="28" text-anchor="start" font-weight="400" fill="#e7ecf5">Likes hard thinking:</text><text x="830.0" y="417.7" font-size="28" text-anchor="start" font-weight="400" fill="#e7ecf5">effort costs little</text><text x="830.0" y="556.1" font-size="28" text-anchor="start" font-weight="400" fill="#e7ecf5">Prefers to spare it:</text><text x="830.0" y="591.1" font-size="28" text-anchor="start" font-weight="400" fill="#e7ecf5">effort costs more</text><text x="830.0" y="180.0" font-size="26" text-anchor="start" font-weight="400" fill="#8a96b3">Feedback, even sham,</text><text x="830.0" y="212.5" font-size="26" text-anchor="start" font-weight="400" fill="#8a96b3">flattened the curve</text><text x="830.0" y="245.0" font-size="26" text-anchor="start" font-weight="400" fill="#8a96b3">(N = 251)</text><text x="90.0" y="778.0" font-size="20" text-anchor="start" font-weight="400" fill="#8a96b3">Schematic. Curves illustrate Zerna et al. 2026, not fitted; Cacioppo et al. 1996.</text></svg>
