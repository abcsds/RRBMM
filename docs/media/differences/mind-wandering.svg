<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t d" font-family='"Segoe UI","Helvetica Neue",system-ui,sans-serif'><title id="t">Mind wandering: chosen or not</title><desc id="d">Schematic two-by-two grid of deliberate against spontaneous mind wandering, where the reason for including it is that these are separate questions rather than one trait.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1280" height="800" fill="#0b1020"/><text x="90.0" y="72.0" font-size="44" text-anchor="start" font-weight="700" fill="#ffffff">Mind wandering: chosen or not</text><rect x="150.0" y="160.0" width="500.0" height="500.0" rx="2" fill="none" stroke="#8a96b3" stroke-width="2" /><line x1="400.0" y1="160.0" x2="400.0" y2="660.0" stroke="#8a96b3" stroke-width="1" stroke-dasharray="4 6"/><line x1="150.0" y1="410.0" x2="650.0" y2="410.0" stroke="#8a96b3" stroke-width="1" stroke-dasharray="4 6"/><text x="400.0" y="704.0" font-size="28" text-anchor="middle" font-weight="600" fill="#e7ecf5">Deliberate: I choose to drift</text><text x="110" y="410.0" font-size="28" font-weight="600" text-anchor="middle" fill="#e7ecf5" transform="rotate(-90 110 410.0)">Spontaneous: it just happens</text><text x="275.0" y="545.0" font-size="30" text-anchor="middle" font-weight="400" fill="#e7ecf5">On task</text><text x="525.0" y="528.0" font-size="30" text-anchor="middle" font-weight="400" fill="#e7ecf5">Daydreams</text><text x="525.0" y="565.5" font-size="30" text-anchor="middle" font-weight="400" fill="#e7ecf5">on purpose</text><text x="275.0" y="278.0" font-size="30" text-anchor="middle" font-weight="400" fill="#e7ecf5">Drifts</text><text x="275.0" y="315.5" font-size="30" text-anchor="middle" font-weight="400" fill="#e7ecf5">unasked</text><text x="525.0" y="295.0" font-size="30" text-anchor="middle" font-weight="400" fill="#e7ecf5">Both</text><text x="710.0" y="200.0" font-size="44" text-anchor="start" font-weight="700" fill="#6fd3ff">Two questions,</text><text x="710.0" y="255.0" font-size="44" text-anchor="start" font-weight="700" fill="#6fd3ff">not one.</text><text x="710.0" y="340.0" font-size="30" text-anchor="start" font-weight="400" fill="#e7ecf5">Measured separately,</text><text x="710.0" y="377.5" font-size="30" text-anchor="start" font-weight="400" fill="#e7ecf5">they respond differently</text><text x="710.0" y="415.0" font-size="30" text-anchor="start" font-weight="400" fill="#e7ecf5">to the same manipulation.</text><text x="710.0" y="500.0" font-size="30" text-anchor="start" font-weight="400" fill="#e7ecf5">Only the spontaneous kind</text><text x="710.0" y="537.5" font-size="30" text-anchor="start" font-weight="400" fill="#e7ecf5">predicted fidgeting.</text><text x="710.0" y="625.0" font-size="26" text-anchor="start" font-weight="400" fill="#8a96b3">Self-report scales.</text><text x="90.0" y="778.0" font-size="20" text-anchor="start" font-weight="400" fill="#8a96b3">Schematic. Seli, Risko &amp; Smilek 2016; Carriere, Seli &amp; Smilek 2013.</text></svg>
