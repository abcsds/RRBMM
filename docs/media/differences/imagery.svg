<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t d" font-family='"Segoe UI","Helvetica Neue",system-ui,sans-serif'><title id="t">Imagery: not everyone sees the apple</title><desc id="d">Score ruler with study cut-offs and a waffle chart of one hundred people, where the reason for including it is that visual imagery ranges widely and about four in a hundred screen as aphantasic.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1280" height="800" fill="#0b1020"/><text x="90.0" y="72.0" font-size="44" text-anchor="start" font-weight="700" fill="#ffffff">Imagery: not everyone sees the apple</text><text x="90.0" y="120.0" font-size="32" text-anchor="start" font-weight="600" fill="#e7ecf5">“Picture an apple.” VVIQ score, 16 to 80</text><rect x="90.0" y="190.0" width="1100.0" height="44.0" rx="2" fill="none" stroke="#8a96b3" stroke-width="2" /><rect x="90.0" y="190.0" width="120.3" height="44.0" rx="2" fill="#ffcf6f" stroke="none" stroke-width="2" /><text x="90.0" y="274.0" font-size="30" text-anchor="start" font-weight="700" fill="#e7ecf5">Aphantasia</text><text x="90.0" y="310.0" font-size="26" text-anchor="start" font-weight="400" fill="#8a96b3">16–23</text><rect x="760.3" y="190.0" width="85.9" height="44.0" rx="2" fill="#6fd3ff" stroke="none" stroke-width="2" /><text x="803.3" y="274.0" font-size="30" text-anchor="middle" font-weight="700" fill="#e7ecf5">Midrange</text><text x="803.3" y="310.0" font-size="26" text-anchor="middle" font-weight="400" fill="#8a96b3">55–60</text><rect x="1104.1" y="190.0" width="85.9" height="44.0" rx="2" fill="#b48cff" stroke="none" stroke-width="2" /><text x="1190.0" y="274.0" font-size="30" text-anchor="end" font-weight="700" fill="#e7ecf5">Hyperphantasia</text><text x="1190.0" y="310.0" font-size="26" text-a