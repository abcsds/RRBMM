<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t d" font-family='"Segoe UI","Helvetica Neue",system-ui,sans-serif'><title id="t">Personality: dials, not grades</title><desc id="d">Five bipolar scales with two invented people and three bars of published heritability, where the reason for including it is that traits are continuous dimensions, about forty percent heritable overall.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1280" height="800" fill="#0b1020"/><text x="90.0" y="72.0" font-size="44" text-anchor="start" font-weight="700" fill="#ffffff">Personality: dials, not grades</text><text x="90.0" y="118.0" font-size="32" text-anchor="start" font-weight="600" fill="#e7ecf5">Five dials. Each end has its uses.</text><text x="90.0" y="200.0" font-size="30" text-anchor="start" font-weight="600" fill="#e7ecf5">Openness</text><line x1="500.0" y1="190.0" x2="1190.0" y2="190.0" stroke="#8a96b3" stroke-width="3"/><text x="500.0" y="224.0" font-size="24" text-anchor="start" font-weight="400" fill="#8a96b3">conventional</text><text x="1190.0" y="224.0" font-size="24" text-anchor="end" font-weight="400" fill="#8a96b3">curious</text><text x="90.0" y="278.0" font-size="30" text-anchor="start" font-weight="600" fill="#e7ecf5">Conscientiousness</text><line x1="500.0" y1="268.0" x2="1190.0" y2="268.0" stroke="#8a96b3" stroke-width="3"/><text x="500.0" y="302.0" font-size="24" text-anchor="start" font-weight="400" fill="#8a96b3">flexible</text><text x="1190.0" y="302.0" font-size="24" text-anchor="end" font-weight="400" fill="#8a96b3">organised</text><text x="90.0" y="356.0" font-size="30" text-anchor="start" font-weight="600" fill="#e7ecf5">Extraversion</text><line x1="500.0" y1="346.0" x2="1190.0" y2="346.0" stroke="#8a96b3" stroke-width="3"/><text x="500.0" y="380.0" font-size="24" text-anchor="start" font-weight="400" fill="#8a96b3">reserved</text><text x="1190.0" y="380.0" font-size="24" text-anchor="end" font-weight="400" fill="#8a96b3">outgoing</text><text x="90.0" y="434.0" font-size="30" text-anchor="start" font-weight="600" fill="#e7ecf5">Agreeableness</text><line x1="500.0" y1="424.0" x2="1190.0" y2="424.0" stroke="#8a96b3" stroke-width="3"/><text x="500.0" y="458.0" font-size="24" text-anchor="start" font-weight="400" fill="#8a96b3">challenging</text><text x="1190.0" y="458.0" font-size="24" text-anchor="end" font-weight="400" fill="#8a96b3">accommodating</text><text x="90.0" y="512.0" font-size="30" text-anchor="start" font-weight="600" fill="#e7ecf5">Negative emotionality</text><line x1="500.0" y1="502.0" x2="1190.0" y2="502.0" stroke="#8a96b3" stroke-width="3"/><text x="500.0" y="536.0" font-size="24" text-anchor="start" font-weight="400" fill="#8a96b3">steady</text><text x="1190.0" y="536.0" font-size="24" text-anchor="end" font-weight="400" fill="#8a96b3">reactive</text><polyline points="1052.0,190.0 707.0,268.0 672.5,346.0 879.5,424.0 948.5,502.0" fill="none" stroke="#6fd3ff" stroke-width="3" stroke-opacity="1.0" stroke-linejoin="round"/><polyline points="741.5,190.0 1052.0,268.0 983.0,346.0 776.0,424.0 707.0,502.0" fill="none" stroke="#ffcf6f" stroke-width="3" stroke-opacity="1.0" stroke-linejoin="round" stroke-dasharray="12 8"/><circle cx="1052.0" cy="190.0" r="11" fill="#6fd3ff" stroke="none" stroke-width="2"/><circle cx="707.0" cy="268.0" r="11" fill="#6fd3ff" stroke="none" stroke-width="2"/><circle cx="672.5" cy="346.0" r="11" fill="#6fd3ff" stroke="none" stroke-width="2"/><circle cx="879.5" cy="424.0" r="11" fill="#6fd3ff" stroke="none" stroke-width="2"/><circle cx="948.5" cy="502.0" r="11" fill="#6fd3ff" stroke="none" stroke-width="2"/><rect x="731.5" y="180.0" width="20.0" height="20.0" rx="2" fill="#ffcf6f" stroke="none" stroke-width="2" /><rect x="1042.0" y="258.0" width="20.0" height