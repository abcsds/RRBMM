<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t d" font-family='"Segoe UI","Helvetica Neue",system-ui,sans-serif'><title id="t">Motivation is a continuum, not a switch</title><desc id="d">Continuum diagram of motivation types with a dot plot of published effect sizes, where the reason for including it is that rewards undermine later free-choice engagement while positive feedback raises it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1280" height="800" fill="#0b1020"/><text x="90.0" y="72.0" font-size="44" text-anchor="start" font-weight="700" fill="#ffffff">Motivation is a continuum, not a switch</text><text x="90.0" y="140.0" font-size="26" text-anchor="start" font-weight="400" fill="#8a96b3">less autonomous</text><text x="1190.0" y="140.0" font-size="26" text-anchor="end" font-weight="400" fill="#8a96b3">more autonomous</text><line x1="90.0" y1="200.0" x2="1190.0" y2="200.0" stroke="#8a96b3" stroke-width="3" marker-end="url(#arrow)"/><circle cx="170.0" cy="200.0" r="13" fill="#6fd3ff" stroke="none" stroke-width="2"/><text x="170.0" y="250.0" font-size="28" text-anchor="middle" font-weight="600" fill="#e7ecf5">Amotivation</text><text x="170.0" y="286.0" font-size="26" text-anchor="middle" font-weight="400" fill="#8a96b3">no reason</text><circle cx="405.0" cy="200.0" r="13" fill="#6fd3ff" stroke="none" stroke-width="2"/><text x="405.0" y="250.0" font-size="28" text-anchor="middle" font-weight="600" fill="#e7ecf5">External</text><text x="405.0" y="286.0" font-size="26" text-anchor="middle" font-weight="400" fill="#8a96b3">reward, threat</text><circle cx="640.0" cy="200.0" r="13" fill="#6fd3ff" stroke="none" stroke-width="2"/><text x="640.0" y="250.0" font-size="28" text-anchor="middle" font-weight="600" fill="#e7ecf5">Introjected</text><text x="640.0" y="286.0" font-size="26" text-anchor="middle" font-weight="400" fill="#8a96b3">guilt, ego</text><circle cx="875.0" cy="200.0" r="13" fill="#6fd3ff" stroke="none" stroke-width="2"/><text x="875.0" y="250.0" font-size="28" text-anchor="middle" font-weight="600" fill="#e7ecf5">Identified</text><text x="875.0" y="286.0" font-size="26" text-anchor="middle" font-weight="400" fill="#8a96b3">I value it</text><circle cx="1110.0" cy="200.0" r="13" fill="#6fd3ff" stroke="none" stroke-width="2"/><text x="1110.0" y="250.0" font-size="28" text-anchor="middle" font-weight="600" fill="#e7ecf5">Intrinsic</text><text x="1110.0" y="286.0" font-size="26" text-anchor="middle" font-weight="400" fill="#8a96b3">I like doing it</text><text x="90.0" y="355.0" font-size="28" text-anchor="start" font-weight="600" fill="#e7ecf5">Does a reward erode it? Free-choice behaviour afterwards, Cohen&#x27;s d</text><line x1="870.0" y1="385.0" x2="870.0" y2="628.0" stroke="#8a96b3" stroke-width="2"/><text x="870.0" y="659.0" font-size="24" text-anchor="middle" font-weight="400" fill="#8a96b3">0, no change</text><text x="90.0" y="425.0" font-size="28" text-anchor="start" font-weight="400" fill="#e7ecf5">Reward for doing the task</text><line x1="870.0" y1="415.0" x2="622.0" y2="415.0" stroke="#ffcf6f" stroke-width="4"/><rect x="612.0" y="405.0" width="20.0" height="20.0" rx="2" fill="#ffcf6f" stroke="none" stroke-width="2" /><text x="600.0" y="425.0" font-size="28" text-anchor="end" font-weight="600" fill="#e7ecf5">−0.40</text><text x="90.0" y="487.0" font-size="28" text-anchor="start" font-weight="400" fill="#e7ecf5">Reward for finishing it</text><line x1="870.0" y1="477.0" x2="646.8" y2="477.0" stroke="#ffcf6f" stroke-width="4"/><rect x="636.8" y="467.0" width="20.0" height="20.0" rx="2" fill="#ffcf6f" stroke="none" stroke-width="2" /><text x="624.8" y="487.0" font-size="28" text-anchor="end" font-weight="600" fill="#e7ecf5">−0.36</text><text x="90.0" y="549.0" font-size="28" text-anchor="start" font-weight="400" fill="#e7ecf5">Reward for performance</text><line x1="870.0" y1="539.0" x2="696.4" y2="539.0" stroke="#ffcf6f" stroke-width="4"/><rect x="686.4" y="529.0" width="20.0" height="20.0" rx="2" fill="#ffcf6f" stroke="none" stroke-width="2" /><text x="674.4" y="549.0" font-size="28" text-anchor="end" font-weight="600" fill="#e7ecf5">−0.28</text><text x="90.0" y="611.0" font-size="28" text-anchor="start" font-weight="400" fill="#e7ecf5">Positive feedback</text><line x1="870.0" y1="601.0" x2="1074.6" y2="601.0" stroke="#7ee0a8" stroke-width="4"/><circle cx="1074.6" cy="601.0" r="11" fill="#7ee0a8" stroke="none" stroke-width="2"/><text x="1096.6" y="611.0" font-size="28" text-anchor="start" font-weight="600" fill="#e7ecf5">+0.33</text><text x="90.0" y="778.0" font-size="20" text-anchor="start" font-weight="400" fill="#8a96b3">Published values. Stages: Howard et al. 2017. Effects: Deci et al. 1999, 128 studies.</text></svg>
