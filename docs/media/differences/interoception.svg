<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t d" font-family='"Segoe UI","Helvetica Neue",system-ui,sans-serif'><title id="t">Interoception: three gauges, not one</title><desc id="d">Schematic of three invented people on three separate sliders, where the reason for including it is that interoceptive accuracy, sensibility and awareness are dissociable.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1280" height="800" fill="#0b1020"/><text x="90.0" y="72.0" font-size="44" text-anchor="start" font-weight="700" fill="#ffffff">Interoception: three gauges, not one</text><text x="650.0" y="150.0" font-size="28" text-anchor="middle" font-weight="600" fill="#e7ecf5">Person A</text><text x="890.0" y="150.0" font-size="28" text-anchor="middle" font-weight="600" fill="#e7ecf5">Person B</text><text x="1130.0" y="150.0" font-size="28" text-anchor="middle" font-weight="600" fill="#e7ecf5">Person C</text><text x="90.0" y="238.0" font-size="34" text-anchor="start" font-weight="700" fill="#e7ecf5">Accuracy</text><text x="90.0" y="278.0" font-size="26" text-anchor="start" font-weight="400" fill="#8a96b3">can you detect your heartbeat?</text><line x1="560.0" y1="240.0" x2="740.0" y2="240.0" stroke="#8a96b3" stroke-width="4"/><text x="560.0" y="274.0" font-size="22" text-anchor="start" font-weight="400" fill="#8a96b3">low</text><text x="740.0" y="274.0" font-size="22" text-anchor="end" font-weight="400" fill="#8a96b3">high</text><circle cx="707.6" cy="240.0" r="15" fill="#6fd3ff" stroke="#0b1020" stroke-width="3"/><line x1="800.0" y1="240.0" x2="980.0" y2="240.0" stroke="#8a96b3" stroke-width="4"/><text x="800.0" y="274.0" font-size="22" text-anchor="start" font-weight="400" fill="#8a96b3">low</text><text x="980.0" y="274.0" font-size="22" text-anchor="end" font-weight="400" fill="#8a96b3">high</text><circle cx="845.0" cy="240.0" r="15" fill="#6fd3ff" stroke="#0b1020" stroke-width="3"/><line x1="1040.0" y1="240.0" x2="1220.0" y2="240.0" stroke="#8a96b3" stroke-width="4"/><text x="1040.0" y="274.0" font-size="22" text-anchor="start" font-weight="400" fill="#8a96b3">low</text><text x="1220.0" y="274.0" font-size="22" text-anchor="end" font-weight="400" fill="#8a96b3">high</text><circle cx="1148.0" cy="240.0" r="15" fill="#6fd3ff" stroke="#0b1020" stroke-width="3"/><text x="90.0" y="388.0" font-size="34" text-anchor="start" font-weight="700" fill="#e7ecf5">Sensibility</text><text x="90.0" y="428.0" font-size="26" text-anchor="start" font-weight="400" fill="#8a96b3">do you believe you can?</text><line x1="560.0" y1="390.0" x2="740.0" y2="390.0" stroke="#8a96b3" stroke-width="4"/><text x="560.0" y="424.0" font-size="22" text-anchor="start" font-weight="400" fill="#8a96b3">low</text><text x="740.0" y="424.0" font-size="22" text-anchor="end" font-weight="400" fill="#8a96b3">high</text><circle cx="605.0" cy="390.0" r="15" fill="#6fd3ff" stroke="#0b1020" stroke-width="3"/><line x1="800.0" y1="390.0" x2="980.0" y2="390.0" stroke="#8a96b3" stroke-width="4"/><text x="800.0" y="424.0" font-size="22" text-anchor="start" font-weight="400" fill="#8a96b3">low</text><text x="980.0" y="424.0" font-size="22" text-anchor="end" font-weight="400" fill="#8a96b3">high</text><circle cx="953.0" cy="390.0" r="15" fill="#6fd3ff" stroke="#0b1020" stroke-width="3"/><line x1="1040.0" y1="390.0" x2="1220.0" y2="390.0" stroke="#8a96b3" stroke-width="4"/><text x="1040.0" y="424.0" font-size="22" text-anchor="start" font-weight="400" fill="#8a96b3">low</text><text x="1220.0" y="424.0" font-size="22" text-anchor="end" font-weight="400" fill="#8a96b3">high</text><circle cx="1148.0" cy="390.0" r="15" fill="#6fd3ff" stroke="#0b1020" stroke-width="3"/><text x="90.0" y="538.0" font-size="34" text-anchor="start" font-weight="700" fill="#e7ecf5">Awareness</text><text x="90.0" y="578.0" font-size="26" text-anchor="start" font-weight="400" fill="#8a96b3">does your confidence track it?</text><line x1="560.0" y1="540.0" x2="740.0" y2="540.0" stroke="#8a96b3" stroke-width="4"/><text x="560.0" y="574.0" font-size="22" text-anchor="start" font-weight="400" fill="#8a96b3">low</text><text x="740.0" y="574.0" font-size="22" text-anchor="end" font-weight="400" fill="#8a96b3">high</text><circle cx="614.0" cy="540.0" r="15" fill="#6fd3ff" stroke="#0b1020" stroke-width="3"/><line x1="800.0" y1="540.0" x2="980.0" y2="540.0" stroke="#8a96b3" stroke-width="4"/><text x="800.0" y="574.0" font-size="22" text-anchor="start" font-weight="400" fill="#8a96b3">low</text><text x="980.0" y="574.0" font-size="22" text-anchor="end" font-weight="400" fill="#8a96b3">high</text><circle cx="836.0" cy="540.0" r="15" fill="#6fd3ff" stroke="#0b1020" stroke-width="3"/><line x1="1040.0" y1="540.0" x2="1220.0" y2="540.0" stroke="#8a96b3" stroke-width="4"/><text x="1040.0" y="574.0" font-size="22" text-anchor="start" font-weight="400" fill="#8a96b3">low</text><text x="1220.0" y="574.0" font-size="22" text-anchor="end" font-weight="400" fill="#8a96b3">high</text><circle cx="1193.0" cy="540.0" r="15" fill="#6fd3ff" stroke="#0b1020" stroke-width="3"/><text x="90.0" y="665.0" font-size="30" text-anchor="start" font-weight="600" fill="#e7ecf5">Dissociable in a sample of 80: one gauge only partly predicts another.</text><text x="90.0" y="708.0" font-size="26" text-anchor="start" font-weight="600" fill="#ffcf6f">The heartbeat-counting task itself is contested.</text><text x="90.0" y="778.0" font-size="20" text-anchor="start" font-weight="400" fill="#8a96b3">Schematic. Invented profiles. Dimensions: Garfinkel et al. 2015. Task debate: Ainley et al. 2020.</text></svg>
