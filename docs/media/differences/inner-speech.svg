<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t d" font-family='"Segoe UI","Helvetica Neue",system-ui,sans-serif'><title id="t">Inner speech: not everybody narrates</title><desc id="d">Table of four tasks with filled or hollow markers, where the reason for including it is that low inner speech went with lower verbal memory and rhyme performance but not with task-switching or categorical perception.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1280" height="800" fill="#0b1020"/><text x="90.0" y="72.0" font-size="44" text-anchor="start" font-weight="700" fill="#ffffff">Inner speech: not everybody narrates</text><text x="90.0" y="130.0" font-size="30" text-anchor="start" font-weight="600" fill="#e7ecf5">People reporting low (N = 46) against high (N = 47) inner speech</text><line x1="90.0" y1="256.0" x2="1190.0" y2="256.0" stroke="#2a3350" stroke-width="2"/><text x="90.0" y="228.0" font-size="36" text-anchor="start" font-weight="500" fill="#e7ecf5">Verbal working memory</text><circle cx="760.0" cy="216.0" r="18" fill="#ffcf6f" stroke="none" stroke-width="2"/><text x="800.0" y="228.0" font-size="30" text-anchor="start" font-weight="400" fill="#e7ecf5">lower for low inner speech</text><line x1="90.0" y1="348.0" x2="1190.0" y2="348.0" stroke="#2a3350" stroke-width="2"/><text x="90.0" y="320.0" font-size="36" text-anchor="start" font-weight="500" fill="#e7ecf5">Rhyme judgements</text><circle cx="760.0" cy="308.0" r="18" fill="#ffcf6f" stroke="none" stroke-width="2"/><text x="800.0" y="320.0" font-size="30" text-anchor="start" font-weight="400" fill="#e7ecf5">lower for low inner speech</text><line x1="90.0" y1="440.0" x2="1190.0" y2="440.0" stroke="#2a3350" stroke-width="2"/><text x="90.0" y="412.0" font-size="36" text-anchor="start" font-weight="500" fill="#e7ecf5">Task switching</text><circle cx="760.0" cy="400.0" r="18" fill="none" stroke="#6fd3ff" stroke-width="4"/><text x="800.0" y="412.0" font-size="30" text-anchor="start" font-weight="400" fill="#e7ecf5">no difference</text><line x1="90.0" y1="532.0" x2="1190.0" y2="532.0" stroke="#2a3350" stroke-width="2"/><text x="90.0" y="504.0" font-size="36" text-anchor="start" font-weight="500" fill="#e7ecf5">Categorical perception</text><circle cx="760.0" cy="492.0" r="18" fill="none" stroke="#6fd3ff" stroke-width="4"/><text x="800.0" y="504.0" font-size="30" text-anchor="start" font-weight="400" fill="#e7ecf5">no difference</text><text x="90.0" y="640.0" font-size="32" text-anchor="start" font-weight="600" fill="#e7ecf5">A continuum, from near constant to near none.</text><text x="90.0" y="690.0" font-size="28" text-anchor="start" font-weight="400" fill="#ffcf6f">“No inner voice at all” is disputed. Safer to say “less of it”.</text><text x="90.0" y="778.0" font-size="20" text-anchor="start" font-weight="400" fill="#8a96b3">Published results. Nedergaard &amp; Lupyan 2024; dispute: Lupyan &amp; Nedergaard 2025 (preprint).</text></svg>
