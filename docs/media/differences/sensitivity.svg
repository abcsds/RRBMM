<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t d" font-family='"Segoe UI","Helvetica Neue",system-ui,sans-serif'><title id="t">Sensitivity: more gain on the input</title><desc id="d">Stacked bar of three published sensitivity groups beside a schematic of two crossing lines, where the reason for including it is that more sensitive people do worse in harsh settings and better in supportive ones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1280" height="800" fill="#0b1020"/><text x="90.0" y="72.0" font-size="44" text-anchor="start" font-weight="700" fill="#ffffff">Sensitivity: more gain on the input</text><text x="90.0" y="140.0" font-size="30" text-anchor="start" font-weight="600" fill="#e7ecf5">Adults on the HSP scale, N = 906</text><rect x="91.0" y="230.0" width="137.2" height="100.0" rx="4" fill="#6fd3ff" stroke="none" stroke-width="2" /><text x="159.6" y="295.0" font-size="36" text-anchor="middle" font-weight="700" fill="#0b1020">29%</text><text x="159.6" y="370.0" font-size="30" text-anchor="middle" font-weight="600" fill="#e7ecf5">Low</text><rect x="230.2" y="230.0" width="190.0" height="100.0" rx="4" fill="#7ee0a8" stroke="none" stroke-width="2" /><text x="325.2" y="295.0" font-size="36" text-anchor="middle" font-weight="700" fill="#0b1020">40%</text><text x="325.2" y="370.0" font-size="30" text-anchor="middle" font-weight="600" fill="#e7ecf5">Medium</text><rect x="422.2" y="230.0" width="146.8" height="100.0" rx="4" fill="#ffcf6f" stroke="none" stroke-width="2" /><text x="495.6" y="295.0" font-size="36" text-anchor="middle" font-weight="700" fill="#0b1020">31%</text><text x="495.6" y="370.0" font-size="30" text-anchor="middle" font-weight="600" fill="#e7ecf5">High</text><text x="90.0" y="460.0" font-size="30" text-anchor="start" font-weight="400" fill="#e7ecf5">A continuous trait. These groups</text><text x="90.0" y="497.5" font-size="30" text-anchor="start" font-weight="400" fill="#e7ecf5">are a cut through it, not kinds</text><text x="90.0" y="535.0" font-size="30" text-anchor="start" font-weight="400" fill="#e7ecf5">of person.</text><text x="720.0" y="140.0" font-size="30" text-anchor="start" font-weight="600" fill="#e7ecf5">Same environment, more gain</text><line x1="720.0" y1="520.0" x2="1170.0" y2="520.0" stroke="#8a96b3" stroke-width="2"/><line x1="720.0" y1="520.0" x2="720.0" y2="190.0" stroke="#8a96b3" stroke-width="2"/><text x="720.0" y="558.0" font-size="26" text-anchor="start" font-weight="400" fill="#8a96b3">harsh setting</text><text x="1170.0" y="558.0" font-size="26" text-anchor="end" font-weight="400" fill="#8a96b3">supportive</text><text x="698" y="360.0" font-size="26" text-anchor="middle" fill="#8a96b3" transform="rotate(-90 698 360.0)">how it goes</text><line x1="730.0" y1="490.0" x2="1160.0" y2="220.0" stroke="#ffcf6f" stroke-width="5"/><line x1="730.0" y1="385.0" x2="1160.0" y2="325.0" stroke="#6fd3ff" stroke-width="5" stroke-dasharray="14 9"/><text x="1160.0" y="206.0" font-size="28" text-anchor="end" font-weight="600" fill="#e7ecf5">more sensitive</text><text x="1160.0" y="390.0" font-size="28" text-anchor="end" font-weight="600" fill="#e7ecf5">less sensitive</text><text x="720.0" y="610.0" font-size="26" text-anchor="start" font-weight="400" fill="#8a96b3">Worse in bad settings and better</text><text x="720.0" y="642.5" font-size="26" text-anchor="start" font-weight="400" fill="#8a96b3">in good ones. Measures still need work.</text><text x="90.0" y="778.0" font-size="20" text-anchor="start" font-weight="400" fill="#8a96b3">Published values, with schematic. Groups: Lionetti et al. 2018. Crossing lines, schematic: Greven et al. 2019.</text></svg>
