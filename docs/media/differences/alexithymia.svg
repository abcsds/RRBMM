<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t d" font-family='"Segoe UI","Helvetica Neue",system-ui,sans-serif'><title id="t">Alexithymia: from signal to word</title><desc id="d">Schematic pipeline from body signal to spoken emotion with brackets for what the TAS-20 measures, where the reason for including it is that alexithymia concerns identifying and describing feelings rather than having none.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1280" height="800" fill="#0b1020"/><text x="90.0" y="72.0" font-size="44" text-anchor="start" font-weight="700" fill="#ffffff">Alexithymia: from signal to word</text><rect x="90.0" y="160.0" width="230.0" height="110.0" rx="10" fill="none" stroke="#6fd3ff" stroke-width="3" /><text x="205.0" y="228.0" font-size="30" text-anchor="middle" font-weight="600" fill="#e7ecf5">Body signal</text><line x1="324.0" y1="215.0" x2="372.0" y2="215.0" stroke="#e7ecf5" stroke-width="3" marker-end="url(#arrow)"/><rect x="380.0" y="160.0" width="230.0" height="110.0" rx="10" fill="none" stroke="#6fd3ff" stroke-width="3" /><text x="495.0" y="208.0" font-size="30" text-anchor="middle" font-weight="600" fill="#e7ecf5">Felt as</text><text x="495.0" y="246.0" font-size="30" text-anchor="middle" font-weight="600" fill="#e7ecf5">something</text><line x1="614.0" y1="215.0" x2="662.0" y2="215.0" stroke="#e7ecf5" stroke-width="3" marker-end="url(#arrow)"/><rect x="670.0" y="160.0" width="230.0" height="110.0" rx="10" fill="none" stroke="#6fd3ff" stroke-width="3" /><text x="785.0" y="208.0" font-size="30" text-anchor="middle" font-weight="600" fill="#e7ecf5">Named</text><text x="785.0" y="246.0" font-size="30" text-anchor="middle" font-weight="600" fill="#e7ecf5">emotion</text><line x1="904.0" y1="215.0" x2="952.0" y2="215.0" stroke="#e7ecf5" stroke-width="3" marker-end="url(#arrow)"/><rect x="960.0" y="160.0" width="230.0" height="110.0" rx="10" fill="none" stroke="#6fd3ff" stroke-width="3" /><text x="1075.0" y="208.0" font-size="30" text-anchor="middle" font-weight="600" fill="#e7ecf5">Told to</text><text x="1075.0" y="246.0" font-size="30" text-anchor="middle" font-weight="600" fill="#e7ecf5">someone</text><line x1="495.0" y1="310.0" x2="785.0" y2="310.0" stroke="#ffcf6f" stroke-width="5"/><line x1="495.0" y1="296.0" x2="495.0" y2="324.0" stroke="#ffcf6f" stroke-width="4"/><line x1="785.0" y1="296.0" x2="785.0" y2="324.0" stroke="#ffcf6f" stroke-width="4"/><text x="479.0" y="320.0" font-size="28" text-anchor="end" font-weight="600" fill="#e7ecf5">Identifying feelings</text><line x1="785.0" y1="386.0" x2="1075.0" y2="386.0" stroke="#b48cff" stroke-width="5" stroke-dasharray="12 7"/><line x1="785.0" y1="372.0" x2="785.0" y2="400.0" stroke="#b48cff" stroke-width="4"/><line x1="1075.0" y1="372.0" x2="1075.0" y2="400.0" stroke="#b48cff" stroke-width="4"/><text x="769.0" y="396.0" font-size="28" text-anchor="end" font-weight="600" fill="#e7ecf5">Describing feelings</text><text x="90.0" y="480.0" font-size="28" text-anchor="start" font-weight="400" fill="#e7ecf5">A third TAS-20 factor: attention turned outward rather than inward.</text><text x="90.0" y="560.0" font-size="30" text-anchor="start" font-weight="600" fill="#e7ecf5">A trait with degrees, not a diagnosis.</text><text x="90.0" y="625.0" font-size="26" text-anchor="start" font-weight="400" fill="#8a96b3">Common, not universal, in autism: about 50% against about 5% in comparison groups,</text><text x="90.0" y="657.5" font-size="26" text-anchor="start" font-weight="400" fill="#8a96b3">across 15 studies. Whether the root is general interoception is still argued.</text><text x="90.0" y="778.0" font-size="20" text-anchor="start" font-weight="400" fill="#8a96b3">Schematic, with published values. Factors: Bagby 1994. Prevalence: Kinnaird 2019. Debate: Brewer 2016; Gaggero 2021.</text></svg>
