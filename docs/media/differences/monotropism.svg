<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t d" font-family='"Segoe UI","Helvetica Neue",system-ui,sans-serif'><title id="t">Monotropism: attention built around interest</title><desc id="d">Schematic timeline of two people&#x27;s attention across tasks, where the reason for including it is that the monotropism account proposes deep single-track attention with costly re-entry against many shallower tracks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1280" height="800" fill="#0b1020"/><text x="90.0" y="72.0" font-size="44" text-anchor="start" font-weight="700" fill="#ffffff">Monotropism: attention built around interest</text><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#ffcf6f" stroke-width="4"/></pattern></defs><text x="90.0" y="208.0" font-size="32" text-anchor="start" font-weight="700" fill="#e7ecf5">Monotropic</text><text x="90.0" y="246.0" font-size="24" text-anchor="start" font-weight="400" fill="#8a96b3">one thing, deep</text><rect x="331.0" y="170.0" width="389.5" height="110.0" rx="4" fill="#6fd3ff" stroke="none" stroke-width="2" /><text x="525.8" y="238.0" font-size="36" text-anchor="middle" font-weight="700" fill="#0b1020">A</text><rect x="721.5" y="170.0" width="159.5" height="110.0" rx="2" fill="url(#hatch)" stroke="none" stroke-width="2" /><rect x="882.0" y="170.0" width="317.0" height="110.0" rx="4" fill="#7ee0a8" stroke="none" stroke-width="2" /><text x="1040.5" y="238.0" font-size="36" text-anchor="middle" font-weight="700" fill="#0b1020">B</text><text x="90.0" y="388.0" font-size="32" text-anchor="start" font-weight="700" fill="#e7ecf5">Polytropic</text><text x="90.0" y="426.0" font-size="24" text-anchor="start" font-weight="400" fill="#8a96b3">several, shallower</text><rect x="331.0" y="350.0" width="157.5" height="110.0" rx="4" fill="#6fd3ff" stroke="none" stroke-width="2" /><text x="409.8" y="418.0" font-size="36" text-anchor="middle" font-weight="700" fill="#0b1020">A</text><rect x="489.5" y="350.0" width="29.0" height="110.0" rx="2" fill="url(#hatch)" stroke="none" stroke-width="2" /><rect x="519.5" y="350.0" width="128.5" height="110.0" rx="4" fill="#7ee0a8" stroke="none" stroke-width="2" /><text x="583.8" y="418.0" font-size="36" text-anchor="middle" font-weight="700" fill="#0b1020">B</text><rect x="649.0" y="350.0" width="29.0" height="110.0" rx="2" fill="url(#hatch)" stroke="none" stroke-width="2" /><rect x="679.0" y="350.0" width="143.0" height="110.0" rx="4" fill="#b48cff" stroke="none" stroke-width="2" /><text x="750.5" y="418.0" font-size="36" text-anchor="middle" font-weight="700" fill="#0b1020">C</text><rect x="823.0" y="350.0" width="29.0" height="110.0" rx="2" fill="url(#hatch)" stroke="none" stroke-width="2" /><rect x="853.0" y="350.0" width="143.0" height="110.0" rx="4" fill="#6fd3ff" stroke="none" stroke-width="2" /><text x="924.5" y="418.0" font-size="36" text-anchor="middle" font-weight="700" fill="#0b1020">A</text><rect x="997.0" y="350.0" width="29.0" height="110.0" rx="2" fill="url(#hatch)" stroke="none" stroke-width="2" /><rect x="1027.0" y="350.0" width="172.0" height="110.0" rx="4" fill="#7ee0a8" stroke="none" stroke-width="2" /><text x="1113.0" y="418.0" font-size="36" text-anchor="middle" font-weight="700" fill="#0b1020">B</text><line x1="330.0" y1="490.0" x2="1200.0" y2="490.0" stroke="#8a96b3" stroke-width="2" marker-end="url(#arrow)"/><text x="1200.0" y="526.0" font-size="26" text-anchor="end" font-weight="400" fill="#8a96b3">time</text><rect x="330.0" y="520.0" width="34.0" height="26.0" rx="2" fill="url(#hatch)" stroke="none" stroke-width="2" /><text x="376.0" y="543.0" font-size="26" text-anchor="start" font-weight="400" fill="#e7ecf5">re-entry cost</text><text x="90.0" y="610.0" font-size="28" text-anchor="start" font-weight="400" fill="#e7ecf5">Everyone pays to switch (measured). The proposal, not measured here: attention</text><text x="90.0" y="645.0" font-size="28" text-anchor="start" font-weight="400" fill="#e7ecf5">follows interest first, and leaving deep focus costs more.</text><text x="90.0" y="712.0" font-size="26" text-anchor="start" font-weight="600" fill="#ffcf6f">Mostly lived-experience theory. Its questionnaire is a preprint and not a diagnosis.</text><text x="90.0" y="778.0" font-size="20" text-anchor="start" font-weight="400" fill="#8a96b3">Schematic. Proposal: Murray et al. 2005. Measure: Garau et al. 2023 (preprint). Switching: Monsell 2003.</text></svg>
