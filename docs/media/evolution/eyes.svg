<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d" font-family="'Segoe UI','Helvetica Neue',system-ui,sans-serif">
<title id="t">Evolution of eyes in four stages of sensory task</title>
<desc id="d">Four stages from Nilsson 2013, left to right: nondirectional photoreception, directional photoreception, low-resolution vision and high-resolution vision, each with a schematic eye, its innovation and example animals, above a list of independent origins and dates.</desc>
<rect width="1280" height="800" fill="#0b1020"/>
<rect x="25" y="30" width="290" height="420" rx="12" fill="#161d33" stroke="#6fd3ff" stroke-width="3"/>
<text x="170.0" y="76.0" font-size="30" fill="#e7ecf5" text-anchor="middle" font-weight="700">1 Is there light?</text>
<text x="170.0" y="108.0" font-size="23" fill="#a3aec6" text-anchor="middle">nondirectional</text>
<circle cx="170.0" cy="210.0" r="40" fill="#1b2f46" stroke="#6fd3ff" stroke-width="4"/>
<line x1="85.0" y1="150.0" x2="116.4" y2="172.2" stroke="#a3aec6" stroke-width="3" stroke-linecap="round"/>
<polygon points="123.2,177.0 111.4,174.9 117.3,166.6" fill="#a3aec6"/>
<line x1="255.0" y1="150.0" x2="223.6" y2="172.2" stroke="#a3aec6" stroke-width="3" stroke-linecap="round"/>
<polygon points="216.8,177.0 222.7,166.6 228.6,174.9" fill="#a3aec6"/>
<line x1="80.0" y1="250.0" x2="112.8" y2="235.4" stroke="#a3aec6" stroke-width="3" stroke-linecap="round"/>
<polygon points="120.5,232.0 112.7,241.1 108.5,231.7" fill="#a3aec6"/>
<line x1="260.0" y1="250.0" x2="227.2" y2="235.4" stroke="#a3aec6" stroke-width="3" stroke-linecap="round"/>
<polygon points="219.5,232.0 231.5,231.7 227.3,241.1" fill="#a3aec6"/>
<text x="170.0" y="328.0" font-size="25" fill="#e7ecf5" text-anchor="middle" font-weight="700">photopigment</text>
<text x="170.0" y="366.0" font-size="22" fill="#a3aec6" text-anchor="middle">first opsin:</text>
<text x="170.0" y="392.4" font-size="22" fill="#a3aec6" text-anchor="middle">the daily light cycle</text>
<line x1="317.0" y1="240.0" x2="324.6" y2="240.0" stroke="#e7ecf5" stroke-width="4" stroke-linecap="round"/>
<polygon points="333.0,240.0 322.2,245.1 322.2,234.9" fill="#e7ecf5"/>
<rect x="335" y="30" width="290" height="420" rx="12" fill="#161d33" stroke="#7ee0a8" stroke-width="3"/>
<text x="480.0" y="76.0" font-size="30" fill="#e7ecf5" text-anchor="middle" font-weight="700">2 Which way?</text>
<text x="480.0" y="108.0" font-size="23" fill="#a3aec6" text-anchor="middle">directional</text>
<circle cx="500.0" cy="210.0" r="36" fill="#143026" stroke="#7ee0a8" stroke-width="4"/>
<path d="M515 140 A70 70 0 0 0 515 280" fill="none" stroke="#e7ecf5" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="605.0" y1="210.0" x2="554.4" y2="210.0" stroke="#a3aec6" stroke-width="3" stroke-linecap="round"/>
<polygon points="546.0,210.0 556.8,204.9 556.8,215.1" fill="#a3aec6"/>
<text x="480.0" y="328.0" font-size="25" fill="#e7ecf5" text-anchor="middle" font-weight="700">screening pigment</text>
<text x="480.0" y="366.0" font-size="22" fill="#a3aec6" text-anchor="middle">box jellyfish larva,</text>
<text x="480.0" y="392.4" font-size="22" fill="#a3aec6" text-anchor="middle">polychaete larva</text>
<line x1="627.0" y1="240.0" x2="634.6" y2="240.0" stroke="#e7ecf5" stroke-width="4" stroke-linecap="round"/>
<polygon points="643.0,240.0 632.2,245.1 632.2,234.9" fill="#e7ecf5"/>
<rect x="645" y="30" width="290" height="420" rx="12" fill="#161d33" stroke="#b48cff" stroke-width="3"/>
<text x="790.0" y="76.0" font-size="30" fill="#e7ecf5" text-anchor="middle" font-weight="700">3 A first image</text>
<text x="790.0" y="108.0" font-size="23" fill="#a3aec6" text-anchor="middle">low resolution</text>
<path d="M852 140 A82 82 0 1 0 852 280" fill="none" stroke="#e7ecf5" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="770.0" cy="158.0" r="10" fill="#2a2140" stroke="#b48cff" stroke-width="3"/>
<circle cx="759.0" cy="184.0" r="10" fill="#2a2140" stroke="#b48cff" stroke-width="3"/>
<circle cx="748.0" cy="210.0" r="10" fill="#2a2140" stroke="#b48cff" stroke-width="3"/>
<circle cx="759.0" cy="236.0" r="10" fill="#2a2140" stroke="#b48cff" stroke-width="3"/>
<circle cx="770.0" cy="262.0" r="10" fill="#2a2140" stroke="#b48cff" stroke-width="3"/>
<line x1="915.0" y1="185.0" x2="864.1" y2="199.7" stroke="#a3aec6" stroke-width="3" stroke-linecap="round"/>
<polygon points="856.0,202.0 865.0,194.1 867.8,203.9" fill="#a3aec6"/>
<line x1="915.0" y1="235.0" x2="864.1" y2="220.3" stroke="#a3aec6" stroke-width="3" stroke-linecap="round"/>
<polygon points="856.0,218.0 867.8,216.1 865.0,225.9" fill="#a3aec6"/>
<text x="790.0" y="328.0" font-size="25" fill="#e7ecf5" text-anchor="middle" font-weight="700">folded membranes</text>
<text x="790.0" y="366.0" font-size="22" fill="#a3aec6" text-anchor="middle">flatworm cup,</text>
<text x="790.0" y="392.4" font-size="22" fill="#a3aec6" text-anchor="middle">box jellyfish lens eye</text>
<line x1="937.0" y1="240.0" x2="944.6" y2="240.0" stroke="#e7ecf5" stroke-width="4" stroke-linecap="round"/>
<polygon points="953.0,240.0 942.2,245.1 942.2,234.9" fill="#e7ecf5"/>
<rect x="955" y="30" width="290" height="420" rx="12" fill="#161d33" stroke="#ffcf6f" stroke-width="3"/>
<text x="1100.0" y="76.0" font-size="30" fill="#e7ecf5" text-anchor="middle" font-weight="700">4 Other animals</text>
<text x="1100.0" y="108.0" font-size="23" fill="#a3aec6" text-anchor="middle">high resolution</text>
<circle cx="1090.0" cy="210.0" r="76" fill="#0b1020" stroke="#e7ecf5" stroke-width="8"/>
<path d="M1040 150 A78 78 0 0 0 1040 270" fill="none" stroke="#ffcf6f" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="1156.0" cy="210.0" r="20" fill="#2a2412" stroke="#ffcf6f" stroke-width="4"/>
<line x1="1234.0" y1="185.0" x2="1191.9" y2="201.0" stroke="#a3aec6" stroke-width="3" stroke-linecap="round"/>
<polygon points="1184.0,204.0 1192.3,195.4 1196.0,204.9" fill="#a3aec6"/>
<line x1="1234.0" y1="235.0" x2="1191.9" y2="219.0" stroke="#a3aec6" stroke-width="3" stroke-linecap="round"/>
<polygon points="1184.0,216.0 1196.0,215.1 1192.3,224.6" fill="#a3aec6"/>
<text x="1100.0" y="328.0" font-size="25" fill="#e7ecf5" text-anchor="middle" font-weight="700">focusing optics</text>
<text x="1100.0" y="366.0" font-size="22" fill="#a3aec6" text-anchor="middle">vertebrates, cephalopods,</text>
<text x="1100.0" y="392.4" font-size="22" fill="#a3aec6" text-anchor="middle">arthropods</text>
<text x="40.0" y="500.0" font-size="30" fill="#e7ecf5" text-anchor="start" font-weight="700">First opsin to sharp vision: about 700-530 million years ago</text>
<text x="1240.0" y="500.0" font-size="23" fill="#a3aec6" text-anchor="end">Nilsson 2013</text>
<text x="40.0" y="548.0" font-size="23" fill="#e7ecf5" text-anchor="start" font-weight="700">Not one origin:</text>
<text x="320.0" y="548.0" font-size="20" fill="#a3aec6" text-anchor="start">cnidarian eyes at least 8 times (Picciani 2018); directional twice by Urbilateria (Nilsson 2013)</text>
<text x="40.0" y="592.0" font-size="23" fill="#e7ecf5" text-anchor="start" font-weight="700">Vertebrate camera eye:</text>
<text x="320.0" y="592.0" font-size="20" fill="#a3aec6" text-anchor="start">about 600-500 Ma (Lamb), or 560-520 Ma (Feinberg, Mallatt 2013): the dates disagree</text>
<text x="40.0" y="636.0" font-size="23" fill="#e7ecf5" text-anchor="start" font-weight="700">Oldest sharp eye here:</text>
<text x="320.0" y="636.0" font-size="20" fill="#a3aec6" text-anchor="start">Anomalocaris, about 515 Ma, at least 16,000 lenses in one eye (Paterson 2011)</text>
<text x="40.0" y="680.0" font-size="23" fill="#e7ecf5" text-anchor="start" font-weight="700">How fast it can go:</text>
<text x="320.0" y="680.0" font-size="20" fill="#a3aec6" text-anchor="start">patch to lens eye in a few hundred thousand years, on a model (Nilsson, Pelger 1994)</text>
<text x="40.0" y="778.0" font-size="18" fill="#a3aec6" text-anchor="start">Schematic eyes. Stages: Nilsson 2013. Innovations: Nilsson 2009, alignment ours. First opsin maybe not light-sensitive: Feuda 2012.</text>
</svg>
