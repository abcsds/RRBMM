<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d" font-family="'Segoe UI','Helvetica Neue',system-ui,sans-serif">
<title id="t">Four brains compared</title>
<desc id="d">Schematic anatomies and published neuron counts: layered mammalian neocortex with hippocampus, avian pallium with nuclear organisation and column-like circuits, cephalopod vertical lobe, and insect mushroom body.</desc>
<rect width="1280" height="800" fill="#0b1020"/>
<rect x="20" y="20" width="304" height="690" rx="12" fill="#161d33" stroke="#6fd3ff" stroke-width="3"/>
<text x="172.0" y="66.0" font-size="36" fill="#e7ecf5" text-anchor="middle" font-weight="700">Mammal</text>
<text x="172.0" y="100.0" font-size="22" fill="#a3aec6" text-anchor="middle">layered neocortex</text>
<text x="36.0" y="400.0" font-size="25" fill="#e7ecf5" text-anchor="start">Human: 86.1 billion</text>
<text x="36.0" y="430.0" font-size="25" fill="#e7ecf5" text-anchor="start">(19 % in cerebral cortex)</text>
<text x="36.0" y="460.0" font-size="25" fill="#e7ecf5" text-anchor="start">Dog cortex: 429-627 M</text>
<text x="36.0" y="490.0" font-size="25" fill="#e7ecf5" text-anchor="start">Rat: 200 million</text>
<text x="36.0" y="636.0" font-size="19" fill="#a3aec6" text-anchor="start">Azevedo 2009</text>
<text x="36.0" y="658.8" font-size="19" fill="#a3aec6" text-anchor="start">Jardim-Messeder 2017</text>
<text x="36.0" y="681.6" font-size="19" fill="#a3aec6" text-anchor="start">Herculano-Houzel 2006</text>
<rect x="332" y="20" width="304" height="690" rx="12" fill="#161d33" stroke="#b48cff" stroke-width="3"/>
<text x="484.0" y="66.0" font-size="36" fill="#e7ecf5" text-anchor="middle" font-weight="700">Bird</text>
<text x="484.0" y="100.0" font-size="22" fill="#a3aec6" text-anchor="middle">nuclear pallium, no cortex</text>
<text x="348.0" y="400.0" font-size="25" fill="#e7ecf5" text-anchor="start">Raven: 2.17 billion</text>
<text x="348.0" y="430.0" font-size="25" fill="#e7ecf5" text-anchor="start">pallium: 1.24 billion</text>
<text x="348.0" y="460.0" font-size="25" fill="#e7ecf5" text-anchor="start">brain mass: 14 g</text>
<text x="348.0" y="490.0" font-size="25" fill="#e7ecf5" text-anchor="start">column-like circuits</text>
<text x="348.0" y="636.0" font-size="19" fill="#a3aec6" text-anchor="start">Olkowicz 2016</text>
<text x="348.0" y="658.8" font-size="19" fill="#a3aec6" text-anchor="start">Stacho 2020</text>
<rect x="644" y="20" width="304" height="690" rx="12" fill="#161d33" stroke="#ffcf6f" stroke-width="3"/>
<text x="796.0" y="66.0" font-size="36" fill="#e7ecf5" text-anchor="middle" font-weight="700">Cephalopod</text>
<text x="796.0" y="100.0" font-size="22" fill="#a3aec6" text-anchor="middle">vertical lobe</text>
<text x="660.0" y="400.0" font-size="25" fill="#e7ecf5" text-anchor="start">Octopus vertical lobe:</text>
<text x="660.0" y="430.0" font-size="25" fill="#e7ecf5" text-anchor="start">about 25 million cells</text>
<text x="660.0" y="460.0" font-size="25" fill="#e7ecf5" text-anchor="start">no hippocampus</text>
<text x="660.0" y="490.0" font-size="25" fill="#e7ecf5" text-anchor="start">total not verified</text>
<text x="660.0" y="636.0" font-size="19" fill="#a3aec6" text-anchor="start">Young 1963 in Shigeno 2018</text>
<text x="660.0" y="658.8" font-size="19" fill="#a3aec6" text-anchor="start">Bidel 2023</text>
<rect x="956" y="20" width="304" height="690" rx="12" fill="#161d33" stroke="#7ee0a8" stroke-width="3"/>
<text x="1108.0" y="66.0" font-size="36" fill="#e7ecf5" text-anchor="middle" font-weight="700">Insect</text>
<text x="1108.0" y="100.0" font-size="22" fill="#a3aec6" text-anchor="middle">mushroom body</text>
<text x="972.0" y="400.0" font-size="25" fill="#e7ecf5" text-anchor="start">Fly mushroom body:</text>
<text x="972.0" y="430.0" font-size="25" fill="#e7ecf5" text-anchor="start">about 2,000 neurons</text>
<text x="972.0" y="460.0" font-size="25" fill="#e7ecf5" text-anchor="start">bee count not verified</text>
<text x="972.0" y="636.0" font-size="19" fill="#a3aec6" text-anchor="start">Honegger 2011</text>
<text x="972.0" y="658.8" font-size="19" fill="#a3aec6" text-anchor="start">Bidel 2023</text>
