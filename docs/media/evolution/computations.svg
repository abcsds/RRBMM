<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d" font-family="'Segoe UI','Helvetica Neue',system-ui,sans-serif">
<title id="t">Differences in computation</title>
<desc id="d">Table of memory and theory of mind circuits across species, each claim labelled as evidence or hypothesis, including hippocampal indexing, replay, barcodes, sparse feedforward coding in the octopus vertical lobe and fly mushroom body, and belief coding in human and macaque medial prefrontal cortex.</desc>
<rect width="1280" height="800" fill="#0b1020"/>
<text x="20.0" y="60.0" font-size="23" fill="#e7ecf5" text-anchor="start" font-weight="700">Mammal hippocampus</text>
<rect x="285" y="26" width="975" height="56" rx="8" fill="#143026" stroke="#7ee0a8" stroke-width="2"/>
<text x="300.0" y="62.0" font-size="18" fill="#7ee0a8" text-anchor="start" font-weight="700">EVIDENCE</text>
<text x="432.0" y="62.0" font-size="23" fill="#e7ecf5" text-anchor="start">Rat: cell pairs active together fire together in later sleep</text>
<text x="1250.0" y="62.0" font-size="18" fill="#e7ecf5" text-anchor="end">Wilson 1994</text>
<rect x="285" y="92" width="975" height="56" rx="8" fill="#2a2412" stroke="#ffcf6f" stroke-width="2" stroke-dasharray="10 7"/>
<text x="300.0" y="128.0" font-size="18" fill="#ffcf6f" text-anchor="start" font-weight="700">HYPOTHESIS</text>
<text x="432.0" y="128.0" font-size="23" fill="#e7ecf5" text-anchor="start">An index: a partial cue reinstates the cortical pattern</text>
<text x="1250.0" y="128.0" font-size="18" fill="#e7ecf5" text-anchor="end">Teyler 2007</text>
<text x="20.0" y="192.0" font-size="23" fill="#e7ecf5" text-anchor="start" font-weight="700">Bird hippocampus</text>
<rect x="285" y="158" width="975" height="56" rx="8" fill="#143026" stroke="#7ee0a8" stroke-width="2"/>
<text x="300.0" y="194.0" font-size="18" fill="#7ee0a8" text-anchor="start" font-weight="700">EVIDENCE</text>
<text x="432.0" y="194.0" font-size="23" fill="#e7ecf5" text-anchor="start">Titmouse: place cells and sharp-wave ripples, mammal-like</text>
<text x="1250.0" y="194.0" font-size="18" fill="#e7ecf5" text-anchor="end">Payne 2021</text>
<rect x="285" y="224" width="975" height="56" rx="8" fill="#143026" stroke="#7ee0a8" stroke-width="2"/>
<text x="300.0" y="260.0" font-size="18" fill="#7ee0a8" text-anchor="start" font-weight="700">EVIDENCE</text>
<text x="432.0" y="260.0" font-size="23" fill="#e7ecf5" text-anchor="start">Chickadee: sparse barcode per cache, back at retrieval</text>
<text x="1250.0" y="260.0" font-size="18" fill="#e7ecf5" text-anchor="end">Chettih 2024</text>
<text x="20.0" y="324.0" font-size="23" fill="#e7ecf5" text-anchor="start" font-weight="700">Octopus vertical lobe</text>
<rect x="285" y="290" width="975" height="56" rx="8" fill="#143026" stroke="#7ee0a8" stroke-width="2"/>
<text x="300.0" y="326.0" font-size="18" fill="#7ee0a8" text-anchor="start" font-weight="700">EVIDENCE</text>
<text x="432.0" y="326.0" font-size="23" fill="#e7ecf5" text-anchor="start">Each input reaches about 12 cells; feedforward, with LTP</text>
<text x="1250.0" y="326.0" font-size="18" fill="#e7ecf5" text-anchor="end">Bidel 2023</text>
<text x="20.0" y="390.0" font-size="23" fill="#e7ecf5" text-anchor="start" font-weight="700">Fly mushroom body</text>
<rect x="285" y="356" width="975" height="56" rx="8" fill="#143026" stroke="#7ee0a8" stroke-width="2"/>
<text x="300.0" y="392.0" font-size="18" fill="#7ee0a8" text-anchor="start" font-weight="700">EVIDENCE</text>
<text x="432.0" y="392.0" font-size="23" fill="#e7ecf5" text-anchor="start">Odours encoded in sparse population patterns</text>
<text x="1250.0" y="392.0" font-size="18" fill="#e7ecf5" text-anchor="end">Honegger 2011</text>
<text x="20.0" y="456.0" font-size="23" fill="#e7ecf5" text-anchor="start" font-weight="700">Human dmPFC</text>
<rect x="285" y="422" width="975" height="56" rx="8" fill="#143026" stroke="#7ee0a8" stroke-width="2"/>
<text x="300.0" y="458.0" font-size="18" fill="#7ee0a8" text-anchor="start" font-weight="700">EVIDENCE</text>
<text x="432.0" y="458.0" font-size="23" fill="#e7ecf5" text-anchor="start">Single neurons encode others&#x27; beliefs, apart from one&#x27;s own</text>
<text x="1250.0" y="458.0" font-size="18" fill="#e7ecf5" text-anchor="end">Jamali 2021</text>
<text x="20.0" y="522.0" font-size="23" fill="#e7ecf5" text-anchor="start" font-weight="700">Macaque mPFC</text>
<rect x="285" y="488" width="975" height="56" rx="8" fill="#143026" stroke="#7ee0a8" stroke-width="2"/>
<text x="300.0" y="524.0" font-size="18" fill="#7ee0a8" text-anchor="start" font-weight="700">EVIDENCE</text>
<text x="432.0" y="524.0" font-size="23" fill="#e7ecf5" text-anchor="start">Silencing removes the false-belief gaze bias</text>
<text x="1250.0" y="524.0" font-size="18" fill="#e7ecf5" text-anchor="end">Hayashi 2020</text>
<text x="20.0" y="588.0" font-size="23" fill="#e7ecf5" text-anchor="start" font-weight="700">Across species</text>
<rect x="285" y="554" width="975" height="56" rx="8" fill="#2a2412" stroke="#ffcf6f" stroke-width="2" stroke-dasharray="10 7"/>
<text x="300.0" y="590.0" font-size="18" fill="#ffcf6f" text-anchor="start" font-weight="700">HYPOTHESIS</text>
<text x="432.0" y="590.0" font-size="23" fill="#e7ecf5" text-anchor="start">Sparse wiring alike in octopus, insect and hippocampus</text>
<text x="1250.0" y="590.0" font-size="18" fill="#e7ecf5" text-anchor="end">Bidel 2023</text>
<rect x="285" y="620" width="975" height="56" rx="8" fill="#2a2412" stroke="#ffcf6f" stroke-width="2" stroke-dasharray="10 7"/>
<text x="300.0" y="656.0" font-size="18" fill="#ffcf6f" text-anchor="start" font-weight="700">HYPOTHESIS</text>
<text x="432.0" y="656.0" font-size="23" fill="#e7ecf5" text-anchor="start">Different anatomy, similar function: may be convergence</text>
<text x="1250.0" y="656.0" font-size="18" fill="#e7ecf5" text-anchor="end">Güntürkün 2016</text>
<text x="20.0" y="720.0" font-size="26" fill="#e7ecf5" text-anchor="start" font-weight="700">We found no circuit account of autobiographical memory across species.</text>
</svg>
