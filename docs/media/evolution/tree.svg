<title id="t">Where the literature places each capacity on the tree of life</title>
<desc id="d">Simplified cladogram not to scale from LUCA to bacteria, archaea and animals, with seven numbered capacities at the organisms where authors argue they appear, and contested placements dashed and marked with a question mark. Details in the numbered list beside it.</desc>
