<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d" font-family="'Segoe UI','Helvetica Neue',system-ui,sans-serif">
<title id="t">Iceberg of implicit and explicit knowledge</title>
<desc id="d">Schematic iceberg with the small explicit part above the waterline and the large implicit part below, and an arrow moving things upward into shared language.</desc>
<rect width="1280" height="800" fill="#0b1020"/>
<rect x="0" y="280" width="1280" height="520" fill="#10203a"/>
<line x1="0.0" y1="280.0" x2="1280.0" y2="280.0" stroke="#6fd3ff" stroke-width="3" stroke-dasharray="14 10" stroke-linecap="round"/>
<polygon points="330.0,280.0 450.0,110.0 560.0,70.0 680.0,170.0 790.0,280.0" fill="#26304d" stroke="#e7ecf5" stroke-width="4" stroke-linejoin="round"/>
<text x="560.0" y="200.0" font-size="46" fill="#e7ecf5" text-anchor="middle" font-weight="700">Explicit</text>
<text x="560.0" y="252.0" font-size="30" fill="#e7ecf5" text-anchor="middle">what we can name</text>
<polygon points="330.0,280.0 790.0,280.0 960.0,450.0 800.0,660.0 520.0,730.0 280.0,620.0 170.0,430.0" fill="#1b2f46" stroke="#6fd3ff" stroke-width="4" stroke-linejoin="round"/>
<text x="560.0" y="380.0" font-size="46" fill="#e7ecf5" text-anchor="middle" font-weight="700">Implicit</text>
<text x="560.0" y="432.0" font-size="30" fill="#e7ecf5" text-anchor="middle">what we already do without words</text>
<text x="560.0" y="520.0" font-size="30" fill="#a3aec6" text-anchor="middle">when to interrupt</text>
<text x="560.0" y="556.0" font-size="30" fill="#a3aec6" text-anchor="middle">who needs quiet</text>
<text x="560.0" y="592.0" font-size="30" fill="#a3aec6" text-anchor="middle">how focus feels</text>
<line x1="1040.0" y1="620.0" x2="1040.0" y2="148.0" stroke="#ffcf6f" stroke-width="12" stroke-linecap="round"/>
<polygon points="1040.0,120.0 1057.1,156.2 1022.9,156.2" fill="#ffcf6f"/>
<text x="1090.0" y="330.0" font-size="34" fill="#ffcf6f" text-anchor="start" font-weight="700">The</text>
<text x="1090.0" y="370.8" font-size="34" fill="#ffcf6f" text-anchor="start" font-weight="700">objective</text>
<text x="1040.0" y="75.0" font-size="34" fill="#e7ecf5" text-anchor="middle" font-weight="700">shared language</text>
<text x="1240.0" y="770.0" font-size="24" fill="#a3aec6" text-anchor="end">schematic, examples illustrative</text>
</svg>
