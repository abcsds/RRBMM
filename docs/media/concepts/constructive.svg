<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d" font-family="'Segoe UI','Helvetica Neue',system-ui,sans-serif">
<title id="t">Two aligned columns of construction steps</title>
<desc id="d">Schematic comparing constructive mathematics, where existence means you can build it and a proof is a program, with cognitive science, where a construct exists through a procedure that measures it.</desc>
<rect width="1280" height="800" fill="#0b1020"/>
<text x="335.0" y="80.0" font-size="38" fill="#6fd3ff" text-anchor="middle" font-weight="700">Constructive mathematics</text>
<rect x="70" y="120" width="530" height="120" rx="12" fill="#1b2f46" stroke="#6fd3ff" stroke-width="3"/>
<text x="335.0" y="192.6" font-size="36" fill="#e7ecf5" text-anchor="middle" font-weight="700">Claim: x exists</text>
<line x1="335.0" y1="242.0" x2="335.0" y2="276.2" stroke="#e7ecf5" stroke-width="7" stroke-linecap="round"/>
<polygon points="335.0,293.0 324.7,271.3 345.3,271.3" fill="#e7ecf5"/>
<rect x="70" y="295" width="530" height="120" rx="12" fill="#1b2f46" stroke="#6fd3ff" stroke-width="3"/>
<text x="335.0" y="367.6" font-size="36" fill="#e7ecf5" text-anchor="middle" font-weight="700">Build x</text>
<line x1="335.0" y1="417.0" x2="335.0" y2="451.2" stroke="#e7ecf5" stroke-width="7" stroke-linecap="round"/>
<polygon points="335.0,468.0 324.7,446.3 345.3,446.3" fill="#e7ecf5"/>
<rect x="70" y="470" width="530" height="120" rx="12" fill="#1b2f46" stroke="#6fd3ff" stroke-width="3"/>
<text x="335.0" y="542.6" font-size="36" fill="#e7ecf5" text-anchor="middle" font-weight="700">The proof is a program</text>
<text x="945.0" y="80.0" font-size="38" fill="#ffcf6f" text-anchor="middle" font-weight="700">Cognitive science</text>
<rect x="680" y="120" width="530" height="120" rx="12" fill="#2a2412" stroke="#ffcf6f" stroke-width="3"/>
<text x="945.0" y="192.6" font-size="36" fill="#e7ecf5" text-anchor="middle" font-weight="700">Claim: attention exists</text>
<line x1="945.0" y1="242.0" x2="945.0" y2="276.2" stroke="#e7ecf5" stroke-width="7" stroke-linecap="round"/>
<polygon points="945.0,293.0 934.7,271.3 955.3,271.3" fill="#e7ecf5"/>
<rect x="680" y="295" width="530" height="120" rx="12" fill="#2a2412" stroke="#ffcf6f" stroke-width="3"/>
<text x="945.0" y="367.6" font-size="36" fill="#e7ecf5" text-anchor="middle" font-weight="700">Run a procedure</text>
<line x1="945.0" y1="417.0" x2="945.0" y2="451.2" stroke="#e7ecf5" stroke-width="7" stroke-linecap="round"/>
<polygon points="945.0,468.0 934.7,446.3 955.3,446.3" fill="#e7ecf5"/>
<rect x="680" y="470" width="530" height="120" rx="12" fill="#2a2412" stroke="#ffcf6f" stroke-width="3"/>
<text x="945.0" y="542.6" font-size="36" fill="#e7ecf5" text-anchor="middle" font-weight="700">The score is a measure</text>
<text x="640.0" y="690.0" font-size="40" fill="#e7ecf5" text-anchor="middle" font-weight="700">A parallel, not a lineage.</text>
<text x="40.0" y="778.0" font-size="24" fill="#a3aec6" text-anchor="start">Schematic. Bishop 1967; Wadler 2015; Cronbach and Meehl 1955.</text>
</svg>
