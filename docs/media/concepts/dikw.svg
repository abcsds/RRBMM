<polygon points="1130.0,542.5 1138.5,560.6 1121.5,560.6" fill="#a3aec6"/>
<text x="1240.0" y="505.8" font-size="26" fill="#e7ecf5" text-anchor="end">Contextualization</text>
<line x1="290.0" y1="437.5" x2="290.0" y2="399.0" stroke="#a3aec6" stroke-width="5" stroke-linecap="round"/>
<polygon points="290.0,385.0 298.5,403.1 281.5,403.1" fill="#a3aec6"/>
<text x="290.0" y="369.0" font-size="28" fill="#e7ecf5" text-anchor="middle">Experience</text>
<line x1="850.0" y1="280.0" x2="850.0" y2="241.5" stroke="#a3aec6" stroke-width="5" stroke-linecap="round"/>
<polygon points="850.0,227.5 858.5,245.6 841.5,245.6" fill="#a3aec6"/>
<text x="866.0" y="249.5" font-size="28" fill="#e7ecf5" text-anchor="start">Reflection</text>
