<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d" font-family="'Segoe UI','Helvetica Neue',system-ui,sans-serif">
<title id="t">The DIKW pyramid from the last talk</title>
<desc id="d">Pyramid with data at the base, then information, knowledge and wisdom, and arrows for raw observations, contextualization, experience and reflection.</desc>
<rect width="1280" height="800" fill="#0b1020"/>
<polygon points="80.0,700.0 1200.0,700.0 1060.0,542.5 220.0,542.5" fill="#16304f" stroke="#6fd3ff" stroke-width="4" stroke-linejoin="round"/>
