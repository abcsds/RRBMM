<text x="640.0" y="674.5" font-size="26" fill="#e7ecf5" text-anchor="middle">Raw facts, observations</text>
<polygon points="220.0,542.5 1060.0,542.5 920.0,385.0 360.0,385.0" fill="#1d4770" stroke="#6fd3ff" stroke-width="4" stroke-linejoin="round"/>
<text x="640.0" y="471.8" font-size="40" fill="#e7ecf5" text-anchor="middle" font-weight="700">INFORMATION</text>
<text x="640.0" y="517.0" font-size="26" fill="#e7ecf5" text-anchor="middle">Processed data, patterns</text>
<polygon points="360.0,385.0 920.0,385.0 780.0,227.5 500.0,227.5" fill="#265f94" stroke="#6fd3ff" stroke-width="4" stroke-linejoin="round"/>
<text x="640.0" y="314.2" font-size="36" fill="#e7ecf5" text-anchor="middle" font-weight="700">KNOWLEDGE</text>
<text x="640.0" y="359.5" font-size="26" fill="#e7ecf5" text-anchor="middle">Understanding, insights</text>
<polygon points="500.0,227.5 780.0,227.5 640.0,70.0" fill="#2f78b8" stroke="#6fd3ff" stroke-width="4" stroke-linejoin="round"/>
<text x="640.0" y="172.5" font-size="26" fill="#e7ecf5" text-anchor="middle" font-weight="700">WISDOM</text>
<text x="640.0" y="208.3" font-size="24" fill="#e7ecf5" text-anchor="middle">Judgment, values</text>
<line x1="150.0" y1="747.2" x2="150.0" y2="714.0" stroke="#a3aec6" stroke-width="5" stroke-linecap="round"/>
<polygon points="150.0,700.0 158.5,718.1 141.5,718.1" fill="#a3aec6"/>
<text x="170.0" y="765.2" font-size="28" fill="#e7ecf5" text-anchor="start">Raw observations</text>
