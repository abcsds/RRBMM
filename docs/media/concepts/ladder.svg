<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d" font-family="'Segoe UI','Helvetica Neue',system-ui,sans-serif">
<title id="t">A ladder from physics to theory of mind and language</title>
<desc id="d">Schematic ladder of nine rungs from physics up to theory of mind and language, with bands showing the rungs mainly addressed by evolutionary biology, psychological and social views, continuing into the chain at the top.</desc>
<rect width="1280" height="800" fill="#0b1020"/>
<line x1="60.0" y1="100.0" x2="60.0" y2="748.0" stroke="#a3aec6" stroke-width="6" stroke-linecap="round"/>
<line x1="680.0" y1="100.0" x2="680.0" y2="748.0" stroke="#a3aec6" stroke-width="6" stroke-linecap="round"/>
<rect x="60" y="690" width="620" height="52" rx="12" fill="#1b2f46" stroke="#6fd3ff" stroke-width="3"/>
<text x="370.0" y="726.5" font-size="30" fill="#e7ecf5" text-anchor="middle" font-weight="700">physics</text>
<rect x="60" y="628" width="620" height="52" rx="12" fill="#1b2f46" stroke="#6fd3ff" stroke-width="3"/>
<text x="370.0" y="664.5" font-size="30" fill="#e7ecf5" text-anchor="middle">metabolism</text>
<rect x="60" y="566" width="620" height="52" rx="12" fill="#1b2f46" stroke="#6fd3ff" stroke-width="3"/>
<text x="370.0" y="602.5" font-size="30" fill="#e7ecf5" text-anchor="middle">sentience</text>
<rect x="60" y="504" width="620" height="52" rx="12" fill="#1b2f46" stroke="#6fd3ff" stroke-width="3"/>
<text x="370.0" y="540.5" font-size="30" fill="#e7ecf5" text-anchor="middle">movement</text>
<rect x="60" y="442" width="620" height="52" rx="12" fill="#1b2f46" stroke="#6fd3ff" stroke-width="3"/>
<text x="370.0" y="478.5" font-size="30" fill="#e7ecf5" text-anchor="middle">nervous system and vision</text>
<rect x="60" y="380" width="620" height="52" rx="12" fill="#1b2f46" stroke="#6fd3ff" stroke-width="3"/>
<text x="370.0" y="416.5" font-size="30" fill="#e7ecf5" text-anchor="middle">world representation</text>
<rect x="60" y="318" width="620" height="52" rx="12" fill="#1b2f46" stroke="#6fd3ff" stroke-width="3"/>
<text x="370.0" y="354.5" font-size="30" fill="#e7ecf5" text-anchor="middle">the self</text>
<rect x="60" y="256" width="620" height="52" rx="12" fill="#1b2f46" stroke="#6fd3ff" stroke-width="3"/>
<text x="370.0" y="292.5" font-size="30" fill="#e7ecf5" text-anchor="middle">autobiographical memory</text>
<rect x="60" y="194" width="620" height="52" rx="12" fill="#1b2f46" stroke="#6fd3ff" stroke-width="3"/>
<text x="370.0" y="230.5" font-size="30" fill="#e7ecf5" text-anchor="middle" font-weight="700">theory of mind and language</text>
<rect x="705" y="442" width="175" height="238" rx="12" fill="#143026" stroke="#7ee0a8" stroke-width="4"/>
<text x="792.0" y="553.0" font-size="24" fill="#e7ecf5" text-anchor="middle" font-weight="700">Evolutionary</text>
<text x="792.0" y="581.8" font-size="24" fill="#e7ecf5" text-anchor="middle" font-weight="700">biology view</text>
<rect x="890" y="256" width="175" height="238" rx="12" fill="#2a2148" stroke="#b48cff" stroke-width="4" stroke-dasharray="14 8"/>
<text x="977.0" y="367.0" font-size="24" fill="#e7ecf5" text-anchor="middle" font-weight="700">Psychological</text>
<text x="977.0" y="395.8" font-size="24" fill="#e7ecf5" text-anchor="middle" font-weight="700">view</text>
<rect x="1075" y="194" width="175" height="176" rx="12" fill="#2a2412" stroke="#ffcf6f" stroke-width="4" stroke-dasharray="4 8"/>
<text x="1162.0" y="274.0" font-size="24" fill="#e7ecf5" text-anchor="middle" font-weight="700">Social</text>
<text x="1162.0" y="302.8" font-size="24" fill="#e7ecf5" text-anchor="middle" font-weight="700">view</text>
<rect x="60" y="20" width="620" height="60" rx="12" fill="#2a2412" stroke="#ffcf6f" stroke-width="3"/>
