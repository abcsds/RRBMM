<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family='"Segoe UI","Helvetica Neue",system-ui,sans-serif' role="img" aria-labelledby="t d"><title id="t">The ACT-R architecture</title><desc id="d">Architecture diagram of ACT-R where every module and buffer is shown with its reported brain region, showing how the procedural module connects all others through single-chunk buffers. Goal, declarative, imaginal and temporal modules sit above the procedural module with its matching, selection and execution stages; vision and audio bring in the external world; motor and speech act on it.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1280" height="800" fill="#0b1020"/><rect x="20" y="16" width="236" height="172" rx="8" fill="#161d33" stroke="#6fd3ff" stroke-width="2"/><text x="32" y="43" font-size="18" fill="#e7ecf5" font-weight="700" text-anchor="start">Goal</text><text x="32" y="68" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">2004: intentional module,</text><text x="32" y="89" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">not identified</text><text x="32" y="110" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">2004 buffer: DLPFC</text><rect x="30" y="150" width="49.6" height="28" rx="14" fill="#0b1020" stroke="#6fd3ff" stroke-width="1.5"/><text x="54.8" y="169" font-size="15" fill="#e7ecf5" font-weight="600" text-anchor="middle">goal</text><line x1="138.0" y1="191" x2="138.0" y2="219" stroke="#e7ecf5" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><rect x="268" y="16" width="236" height="172" rx="8" fill="#161d33" stroke="#6fd3ff" stroke-width="2"/><text x="280" y="43" font-size="18" fill="#e7ecf5" font-weight="700" text-anchor="start">Declarative</text><text x="280" y="68" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">2004: temporal, hippocampus</text><text x="280" y="89" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">2004 buffer: VLPFC</text><text x="280" y="110" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">2015: inferior frontal sulcus</text><rect x="278" y="150" width="89.10000000000001" height="28" rx="14" fill="#0b1020" stroke="#6fd3ff" stroke-width="1.5"/><text x="322.55" y="169" font-size="15" fill="#e7ecf5" font-weight="600" text-anchor="middle">retrieval</text><line x1="386.0" y1="191" x2="386.0" y2="219" stroke="#e7ecf5" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><rect x="516" y="16" width="236" height="172" rx="8" fill="#161d33" stroke="#6fd3ff" stroke-width="2"/><text x="528" y="43" font-size="18" fill="#e7ecf5" font-weight="700" text-anchor="start">Imaginal</text><text x="528" y="68" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">also called the problem state</text><text x="528" y="89" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">2004 buffer: parietal</text><text x="528" y="110" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">2015: intraparietal sulcus</text><rect x="526" y="150" width="81.2" height="28" rx="14" fill="#0b1020" stroke="#6fd3ff" stroke-width="1.5"/><text x="566.6" y="169" font-size="15" fill="#e7ecf5" font-weight="600" text-anchor="middle">imaginal</text><rect x="613.2" y="150" width="136.5" height="28" rx="14" fill="#0b1020" stroke="#6fd3ff" stroke-width="1.5"/><text x="681.45" y="169" font-size="15" fill="#e7ecf5" font-weight="600" text-anchor="middle">imaginal-action</text><line x1="634.0" y1="191" x2="634.0" y2="219" stroke="#e7ecf5" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><rect x="764" y="16" width="236" height="172" rx="8" fill="#161d33" stroke="#6fd3ff" stroke-width="2"/><text x="776" y="43" font-size="18" fill="#e7ecf5" font-weight="700" text-anchor="start">Temporal</text><text x="776" y="68" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">interval timing in noisy ticks</text><text x="776" y="89" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">not in 2004 Figure 1</text><text x="776" y="110" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">no region in sources read</text><rect x="774" y="150" width="81.2" height="28" rx="14" fill="#0b1020" stroke="#6fd3ff" stroke-width="1.5"/><text x="814.6" y="169" font-size="15" fill="#e7ecf5" font-weight="600" text-anchor="middle">temporal</text><line x1="882.0" y1="191" x2="882.0" y2="219" stroke="#e7ecf5" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><rect x="20" y="222" width="980" height="172" rx="8" fill="#161d33" stroke="#ffcf6f" stroke-width="3"/><text x="34" y="252" font-size="20" fill="#e7ecf5" font-weight="700" text-anchor="start">Procedural</text><text x="34" y="276" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">2004: productions, basal ganglia</text><rect x="34" y="292" width="300" height="88" rx="8" fill="#0b1020" stroke="#ffcf6f" stroke-width="2"/><text x="184.0" y="318" font-size="18" fill="#e7ecf5" font-weight="700" text-anchor="middle">Matching</text><text x="184.0" y="342" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="middle">2004: striatum</text><text x="184.0" y="364" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="middle">pattern recognition</text><line x1="336" y1="336" x2="351" y2="336" stroke="#ffcf6f" stroke-width="2.5" marker-end="url(#a)"/><rect x="354" y="292" width="300" height="88" rx="8" fill="#0b1020" stroke="#ffcf6f" stroke-width="2"/><text x="504.0" y="318" font-size="18" fill="#e7ecf5" font-weight="700" text-anchor="middle">Selection</text><text x="504.0" y="342" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="middle">2004: pallidum</text><text x="504.0" y="364" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="middle">conflict resolution</text><line x1="656" y1="336" x2="671" y2="336" stroke="#ffcf6f" stroke-width="2.5" marker-end="url(#a)"/><rect x="674" y="292" width="300" height="88" rx="8" fill="#0b1020" stroke="#ffcf6f" stroke-width="2"/><text x="824.0" y="318" font-size="18" fill="#e7ecf5" font-weight="700" text-anchor="middle">Execution</text><text x="824.0" y="342" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="middle">2004: thalamus</text><text x="824.0" y="364" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="middle">changes the buffers</text><text x="986" y="252" font-size="15" fill="#e7ecf5" font-weight="600" text-anchor="end">buffer: production</text><text x="986" y="276" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="end">with the utility and production compilation modules</text><rect x="20" y="428" width="236" height="172" rx="8" fill="#161d33" stroke="#7ee0a8" stroke-width="2"/><rect x="30" y="438" width="65.4" height="28" rx="14" fill="#0b1020" stroke="#7ee0a8" stroke-width="1.5"/><text x="62.7" y="457" font-size="15" fill="#e7ecf5" font-weight="600" text-anchor="middle">visual</text><rect x="101.4" y="438" width="136.5" height="28" rx="14" fill="#0b1020" stroke="#7ee0a8" stroke-width="1.5"/><text x="169.65" y="457" font-size="15" fill="#e7ecf5" font-weight="600" text-anchor="middle">visual-location</text><text x="32" y="494" font-size="18" fill="#e7ecf5" font-weight="700" text-anchor="start">Vision</text><text x="32" y="518" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">2004: occipital etc.</text><text x="32" y="539" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">2004 buffer: parietal</text><text x="32" y="560" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">2015: fusiform gyrus</text><line x1="138.0" y1="397" x2="138.0" y2="425" stroke="#e7ecf5" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><line x1="138.0" y1="634" x2="138.0" y2="603" stroke="#7ee0a8" stroke-width="2.5" marker-end="url(#a)"/><text x="148.0" y="624" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">perception</text><rect x="268" y="428" width="236" height="172" rx="8" fill="#161d33" stroke="#7ee0a8" stroke-width="2"/><rect x="278" y="438" width="57.5" height="28" rx="14" fill="#0b1020" stroke="#7ee0a8" stroke-width="1.5"/><text x="306.75" y="457" font-size="15" fill="#e7ecf5" font-weight="600" text-anchor="middle">aural</text><rect x="341.5" y="438" width="128.60000000000002" height="28" rx="14" fill="#0b1020" stroke="#7ee0a8" stroke-width="1.5"/><text x="405.8" y="457" font-size="15" fill="#e7ecf5" font-weight="600" text-anchor="middle">aural-location</text><text x="280" y="494" font-size="18" fill="#e7ecf5" font-weight="700" text-anchor="start">Audio</text><text x="280" y="518" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">not in 2004 Figure 1</text><text x="280" y="539" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">2015: superior temporal gyrus</text><line x1="386.0" y1="397" x2="386.0" y2="425" stroke="#e7ecf5" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><line x1="386.0" y1="634" x2="386.0" y2="603" stroke="#7ee0a8" stroke-width="2.5" marker-end="url(#a)"/><text x="396.0" y="624" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">perception</text><rect x="516" y="428" width="236" height="172" rx="8" fill="#161d33" stroke="#b48cff" stroke-width="2"/><rect x="526" y="438" width="65.4" height="28" rx="14" fill="#0b1020" stroke="#b48cff" stroke-width="1.5"/><text x="558.7" y="457" font-size="15" fill="#e7ecf5" font-weight="600" text-anchor="middle">manual</text><text x="528" y="494" font-size="18" fill="#e7ecf5" font-weight="700" text-anchor="start">Motor</text><text x="528" y="518" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">2004: motor, cerebellum</text><text x="528" y="539" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">2004 buffer: motor</text><text x="528" y="560" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">2015: precentral gyrus</text><line x1="634.0" y1="397" x2="634.0" y2="425" stroke="#e7ecf5" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><line x1="634.0" y1="603" x2="634.0" y2="634" stroke="#b48cff" stroke-width="2.5" marker-end="url(#a)"/><text x="644.0" y="624" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">action</text><rect x="764" y="428" width="236" height="172" rx="8" fill="#161d33" stroke="#b48cff" stroke-width="2"/><rect x="774" y="438" width="57.5" height="28" rx="14" fill="#0b1020" stroke="#b48cff" stroke-width="1.5"/><text x="802.75" y="457" font-size="15" fill="#e7ecf5" font-weight="600" text-anchor="middle">vocal</text><text x="776" y="494" font-size="18" fill="#e7ecf5" font-weight="700" text-anchor="start">Speech</text><text x="776" y="518" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">not in 2004 Figure 1</text><text x="776" y="539" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">no region in sources read</text><line x1="882.0" y1="397" x2="882.0" y2="425" stroke="#e7ecf5" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><line x1="882.0" y1="603" x2="882.0" y2="634" stroke="#b48cff" stroke-width="2.5" marker-end="url(#a)"/><text x="892.0" y="624" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">action</text><rect x="20" y="636" width="980" height="50" rx="8" fill="#161d33" stroke="#a3aec6" stroke-width="2"/><text x="510" y="669" font-size="22" fill="#e7ecf5" font-weight="700" text-anchor="middle">External world</text><rect x="1014" y="16" width="250" height="330" rx="8" fill="#161d33" stroke="#6fd3ff" stroke-width="2"/><text x="1026" y="44" font-size="19" fill="#e7ecf5" font-weight="700" text-anchor="start">Symbolic</text><text x="1026" y="72" font-size="15" fill="#e7ecf5" font-weight="400" text-anchor="start">Chunks: declarative</text><text x="1026" y="93" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">knowledge</text><text x="1026" y="114" font-size="15" fill="#e7ecf5" font-weight="400" text-anchor="start">Productions: IF-THEN rules</text><text x="1026" y="135" font-size="15" fill="#e7ecf5" font-weight="400" text-anchor="start">Each buffer holds one chunk,</text><text x="1026" y="156" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">visible to the other modules</text><text x="1026" y="177" font-size="15" fill="#e7ecf5" font-weight="400" text-anchor="start">One production fires at a</text><text x="1026" y="198" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">time; default action 50 ms</text><text x="1026" y="238" font-size="15" fill="#e7ecf5" font-weight="400" text-anchor="start">Modules are encapsulated and</text><text x="1026" y="259" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">communicate only through</text><text x="1026" y="280" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">their buffers</text><text x="1026" y="316" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">2004: not committed to how</text><text x="1026" y="337" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">many modules there are</text><rect x="1014" y="358" width="250" height="328" rx="8" fill="#161d33" stroke="#ffcf6f" stroke-width="2"/><text x="1026" y="386" font-size="19" fill="#e7ecf5" font-weight="700" text-anchor="start">Subsymbolic</text><text x="1026" y="414" font-size="15" fill="#e7ecf5" font-weight="600" text-anchor="start">Activation of chunk i</text><text x="1026" y="438" font-size="17" fill="#e7ecf5" font-weight="700" text-anchor="start">A = B + S + P + noise</text><text x="1026" y="460" font-size="14" fill="#a3aec6" font-weight="400" text-anchor="start">B base level: recency, frequency</text><text x="1026" y="480" font-size="14" fill="#a3aec6" font-weight="400" text-anchor="start">S spreading from the buffers</text><text x="1026" y="500" font-size="14" fill="#a3aec6" font-weight="400" text-anchor="start">P partial matching</text><text x="1026" y="534" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">2004: A = B + Σ W S</text><text x="1026" y="566" font-size="15" fill="#e7ecf5" font-weight="600" text-anchor="start">Utility of production i</text><text x="1026" y="590" font-size="13.5" fill="#e7ecf5" font-weight="700" text-anchor="start">U(n) = U(n-1) + α[R(n) - U(n-1)]</text><text x="1026" y="614" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">learned from reward, noisy;</text><text x="1026" y="635" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">the highest utility fires</text><text x="1026" y="664" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">2004: U = PG - C</text><text x="20" y="714" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">Modules and buffers: ACT-R 7.26 reference manual (Bothell). Module names are the manual&#x27;s; 2004 called the goal module intentional.</text><text x="20" y="736" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">2004: Anderson et al. 2004, Fig. 1, ACT-R 5.0. 2015: Borst et al. 2015, Table 1, the original mapping, citing Anderson 2007; left hemisphere.</text><text x="20" y="758" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">Each brain label is the source&#x27;s own and they differ by version. Borst et al. 2015 report a data-driven remapping that moves the visual region.</text><text x="20" y="780" font-size="15" fill="#a3aec6" font-weight="400" text-anchor="start">The 7.26 manual also lists technical modules (device, printing, random and others), left out here because they support the software.</text></svg>
