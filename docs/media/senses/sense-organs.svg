<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d" font-family="'Segoe UI','Helvetica Neue',system-ui,sans-serif"><title id="t">The human sense organs: 38 transducing structures</title><desc id="d">List of human sensory transducers grouped by class, where each is tagged with the physical quantity it transduces, showing that interoceptive sensors are the largest group: 15 of 38. The same data is a table in media/senses/index.html.</desc><rect width="1280" height="800" fill="#0b1020"/><text x="40" y="52" fill="#e7ecf5" font-size="31" font-weight="600">38 sensors: structures that turn a physical quantity into nerve signals</text><text x="40" y="84" fill="#a3aec6" font-size="21">The count depends on the rule: 15 discrete organs, 26 senses, 38 sensors.</text><text x="40" y="136" fill="#6fd3ff" font-size="24" font-weight="700">Distance and chemical (6)</text><text x="40" y="173" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">L</text><text x="64" y="173" fill="#e7ecf5" font-size="22">Rods and cones</text><text x="40" y="207.5" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">L</text><text x="64" y="207.5" fill="#e7ecf5" font-size="22">ipRGCs</text><text x="40" y="242.0" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="64" y="242.0" fill="#e7ecf5" font-size="22">Cochlea</text><text x="40" y="276.5" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">C</text><text x="64" y="276.5" fill="#e7ecf5" font-size="22">Olfactory epithelium</text><text x="40" y="311.0" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">C</text><text x="64" y="311.0" fill="#e7ecf5" font-size="22">Taste buds</text><text x="40" y="345.5" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">C</text><text x="64" y="345.5" fill="#e7ecf5" font-size="22">Trigeminal chemesthesis</text><text x="40" y="402.0" fill="#7ee0a8" font-size="24" font-weight="700">Position and self-motion (5)</text><text x="40" y="439.0" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="64" y="439.0" fill="#e7ecf5" font-size="22">Semicircular canals</text><text x="40" y="473.5" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="64" y="473.5" fill="#e7ecf5" font-size="22">Otolith organs</text><text x="40" y="508.0" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="64" y="508.0" fill="#e7ecf5" font-size="22">Muscle spindles</text><text x="40" y="542.5" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="64" y="542.5" fill="#e7ecf5" font-size="22">Golgi tendon organs</text><text x="40" y="577.0" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="64" y="577.0" fill="#e7ecf5" font-size="22">Joint receptors</text><text x="424" y="136" fill="#b48cff" font-size="24" font-weight="700">Skin and mucosa (12)</text><text x="424" y="173" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="448" y="173" fill="#e7ecf5" font-size="22">Merkel complexes</text><text x="424" y="211" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="448" y="211" fill="#e7ecf5" font-size="22">Meissner corpuscles</text><text x="424" y="249" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="448" y="249" fill="#e7ecf5" font-size="22">Pacinian corpuscles</text><text x="424" y="287" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="448" y="287" fill="#e7ecf5" font-size="22">Ruffini endings</text><text x="424" y="325" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="448" y="325" fill="#e7ecf5" font-size="22">Hair follicle afferents</text><text x="424" y="363" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="448" y="363" fill="#e7ecf5" font-size="22">C-tactile afferents</text><text x="424" y="401" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="448" y="401" fill="#e7ecf5" font-size="22">Krause corpuscles</text><text x="424" y="439" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="448" y="439" fill="#e7ecf5" font-size="22">Periodontal receptors</text><text x="424" y="477" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">T</text><text x="448" y="477" fill="#e7ecf5" font-size="22">Cold endings</text><text x="424" y="515" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">T</text><text x="448" y="515" fill="#e7ecf5" font-size="22">Warm endings</text><text x="424" y="553" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="448" y="553" fill="#e7ecf5" font-size="22">Nociceptors</text><text x="424" y="591" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">C</text><text x="448" y="591" fill="#e7ecf5" font-size="22">Pruriceptors</text><rect x="792" y="104" width="464" height="622" rx="12" fill="none" stroke="#ffcf6f" stroke-width="3"/><text x="816" y="140" fill="#ffcf6f" font-size="24" font-weight="700">Interoceptive (15)</text><text x="816" y="177" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">C</text><text x="840" y="177" fill="#e7ecf5" font-size="22">Carotid bodies</text><text x="816" y="213.5" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">C</text><text x="840" y="213.5" fill="#e7ecf5" font-size="22">Aortic bodies</text><text x="816" y="250.0" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">C</text><text x="840" y="250.0" fill="#e7ecf5" font-size="22">Central chemoreceptors</text><text x="816" y="286.5" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="840" y="286.5" fill="#e7ecf5" font-size="22">Arterial baroreceptors</text><text x="816" y="323.0" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="840" y="323.0" fill="#e7ecf5" font-size="22">Cardiac receptors</text><text x="816" y="359.5" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="840" y="359.5" fill="#e7ecf5" font-size="22">Lung stretch receptors</text><text x="816" y="396.0" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">C</text><text x="840" y="396.0" fill="#e7ecf5" font-size="22">Airway chemosensors</text><text x="816" y="432.5" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">O</text><text x="840" y="432.5" fill="#e7ecf5" font-size="22">Osmoreceptors</text><text x="816" y="469.0" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">C</text><text x="840" y="469.0" fill="#e7ecf5" font-size="22">Area postrema</text><text x="816" y="505.5" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">C</text><text x="840" y="505.5" fill="#e7ecf5" font-size="22">Glucose sensors</text><text x="816" y="542.0" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">T</text><text x="840" y="542.0" fill="#e7ecf5" font-size="22">Brain thermosensors</text><text x="816" y="578.5" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="840" y="578.5" fill="#e7ecf5" font-size="22">Gut stretch receptors</text><text x="816" y="615.0" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">C</text><text x="840" y="615.0" fill="#e7ecf5" font-size="22">Gut chemosensors</text><text x="816" y="651.5" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="840" y="651.5" fill="#e7ecf5" font-size="22">Bladder stretch</text><text x="816" y="688.0" fill="#a3aec6" font-size="19" font-weight="700" font-family="ui-monospace,monospace">M</text><text x="840" y="688.0" fill="#e7ecf5" font-size="22">Rectal stretch</text><text x="424" y="664" fill="#e7ecf5" font-size="20" font-family="ui-monospace,monospace">L light   M mechanical</text><text x="424" y="692" fill="#e7ecf5" font-size="20" font-family="ui-monospace,monospace">T temperature   C chemical</text><text x="424" y="720" fill="#e7ecf5" font-size="20" font-family="ui-monospace,monospace">O osmotic</text><text x="40" y="772" fill="#a3aec6" font-size="18">Our own count from primary literature; much of the evidence is from animals. </text></svg>